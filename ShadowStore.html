        /* =========================================================
           字符串与文本安全清洗工具 (Sanitization Helpers)
        ========================================================= */
        /**
         * HTML 实体字符转义（防止 XSS 注入）
         */
        function escapeHTML(value) {
            return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        /**
         * 清理连续换行符、制表符与冗余空格
         */
        function cleanText(value) {
            return String(value ?? "").replace(/\\n/g, " ").replace(/\\r/g, "").replace(/\\t/g, " ").replace(/\s+/g, " ").trim();
        }

        /**
         * 弹出全局浮层提示 (Toast)
         */
        function showToast(text) {
            toast.textContent = text;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 2000);
        }

        /**
         * 跨环境剪贴板复制工具（兼顾现代 API 与 iOS/旧浏览器降级方案）
         */
        async function copyToClipboard(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {}
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            let success = false;
            try { success = document.execCommand("copy"); } catch (e) {}
            document.body.removeChild(textArea);
            return success;
        }

        /**
         * 从 URL 中提取主域名作为作者/仓库备用标识
         */
        function getDomainPrimaryName(rawURL) {
            if (!rawURL) return "";
            try {
                const url = new URL(rawURL);
                const host = url.hostname.toLowerCase();
                if (/^(\d{1,3}\.){3}\d{1,3}$/.test(host) || host === "localhost" || host.includes(":")) {
                    return host;
                }
                const cleanHost = host.replace(/^www\./, "");
                const parts = cleanHost.split(".");
                if (parts.length >= 2) {
                    const secondLevelTlds = new Set(["com", "org", "net", "edu", "gov", "co", "ac", "biz", "info"]);
                    if (parts.length >= 3 && secondLevelTlds.has(parts[parts.length - 2])) {
                        return parts[parts.length - 3];
                    }
                    return parts[parts.length - 2];
                }
                return parts[0] || host;
            } catch {
                return "";
            }
        }

        /**
         * 从文件 URL 中提取模块文件名（去除 .sgmodule / .srmodule 后缀）
         */
        function getModuleNameFromURL(rawURL) {
            if (!rawURL) return "";
            try {
                const cleanURL = String(rawURL).split(/[?#]/)[0];
                const parts = cleanURL.split("/").filter(Boolean);
                const last = parts.pop() || "";
                let decoded = decodeURIComponent(last);
                return decoded.replace(/\.(?:sgmodule|srmodule|module)$/i, "").trim();
            } catch {
                return "";
            }
        }

        /**
         * 模块名称后备回退解析器
         */
        function resolveFallbackName(fallbackName, rawURL) {
            if (fallbackName && fallbackName !== "未命名模块" && fallbackName.trim()) {
                return fallbackName.trim();
            }
            return getModuleNameFromURL(rawURL) || "未命名模块";
        }

        /**
         * 判断给定名称或路径是否属于国旗/节点图标
         */
        function isFlagKey(key, url = "") {
            if (!key && !url) return false;
            const k = (key || "").toLowerCase().trim();
            const u = (url || "").toLowerCase().trim();
            if (FLAG_CODES.has(k)) return true;
            const flagKeywords = ["flag", "flags", "国旗", "node", "节点", "country", "countries", "region", "regions", "geoip"];
            if (flagKeywords.some(w => k.includes(w) || u.includes(w))) return true;
            if (/\/(?:flags?|countries|regions|country)\//i.test(u)) return true;
            if (/[_\-/](?:cn|us|hk|tw|jp|kr|sg|gb|uk|de|fr|ru|au|mo|ca)\.(?:png|jpg|jpeg|svg|webp)/i.test(u)) return true;
            return false;
        }

        /**
         * 检测模块内容或描述是否已失效 (404 Not Found)
         */
        function isInvalidOr404(text) {
            if (!text) return false;
            const t = String(text);
            return /404\s*:\s*Not\s*Found/i.test(t) ||
                   /404\s+Not\s+Found/i.test(t) ||
                   /Cannot\s+GET/i.test(t) ||
                   /(?:已失效|此模块已失效|资源已失效|链接已失效|文件已删除|文件不存在|404\s*失效)/i.test(t);
        }

        /* =========================================================
           网络请求与 API 调度引擎 (Fetch Engine)
        ========================================================= */
        /**
         * 带超时控制与 GitHub 速率限制拦截的 Fetch 封装
         */
        async function fetchWithTimeout(url, options = {}, timeoutMs = 6000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                // 拦截 GitHub API 403/429 速率限制
                if (url.includes("api.github.com") && (response.status === 403 || response.status === 429)) {
                    throw new Error("GitHub_API_Rate_Limit");
                }
                return response;
            } finally {
                clearTimeout(timer);
            }
        }

        /**
         * 抓取模块原始内容（优先使用 HTTP Range 请求前 2KB 头部信息，极大加快拉取速度并节省流量）
         */
        async function fetchRawText(url, isPartial = true) {
            if (isPartial) {
                try {
                    const response = await fetchWithTimeout(url, { headers: { 'Range': 'bytes=0-2047' }, cache: "no-store" }, 4500);
                    if (response.status === 404) return "404: Not Found";
                    if (response.ok || response.status === 206) return await response.text();
                } catch (e) {}
            }
            try {
                const fallbackRes = await fetchWithTimeout(url, { cache: "no-store" }, 6000);
                if (fallbackRes.status === 404) return "404: Not Found";
                if (fallbackRes.ok) return await fallbackRes.text();
            } catch (err) {}
            throw new Error(`无法获取资源: ${url}`);
        }

        /**
         * 拉取 luestr/IconResource 仓库树并构建图标字典
         */
        async function loadLuestrIcons() {
            try {
                const res = await fetchWithTimeout(CONFIG.LUESTR_TREE_API, { cache: "no-store" }, 6000);
                if (res.ok) {
                    const data = await res.json();
                    if (data && Array.isArray(data.tree)) {
                        for (const item of data.tree) {
                            const path = item.path || "";
                            if (item.type === "blob" && /\.(?:png|jpg|jpeg|svg|webp)$/i.test(path)) {
                                const fileName = path.split("/").pop().replace(/\.(?:png|jpg|jpeg|svg|webp)$/i, "");
                                const url = `https://raw.githubusercontent.com/luestr/IconResource/main/${path}`;
                                if (!isFlagKey(fileName, url)) {
                                    const cleanName = fileName.trim().toLowerCase();
                                    if (cleanName.length >= 2 && !remoteIconsMap[cleanName]) {
                                        remoteIconsMap[cleanName] = url;
                                    }
                                }
                            }
                        }
                    }
                }
            } catch (e) {
                if (e.message === "GitHub_API_Rate_Limit") console.warn("⚠️ IconResource图标库拉取受限");
            }
        }

        /**
         * 拉取 fmz200 聚合图标 JSON 库
         */
        async function loadRemoteIcons() {
            try {
                const response = await fetchWithTimeout(CONFIG.ICONS_JSON_URL, { cache: "no-store" }, 6000);
                if (response.ok) {
                    const data = await response.json();
                    const extractUrl = (item) => {
                        if (typeof item === 'string') return item;
                        if (typeof item === 'object' && item !== null) {
                            return item.icon || item.url || item.src || item.img || item.path || item.link || "";
                        }
                        return "";
                    };

                    const extractName = (item) => {
                        if (typeof item === 'object' && item !== null) {
                            return item.name || item.title || item.label || item.id || item.app || "";
                        }
                        return "";
                    };

                    const addMap = (name, url) => {
                        if (name && typeof name === 'string' && url && typeof url === 'string' && url.length > 5) {
                            if (isFlagKey(name, url)) return;
                            const cleanName = name.trim().toLowerCase();
                            if (cleanName.length < 2) return;
                            remoteIconsMap[cleanName] = url.trim();
                            const baseName = cleanName.replace(/[_-]?\d+$/, "").trim();
                            if (baseName && baseName.length >= 2 && !remoteIconsMap[baseName]) {
                                remoteIconsMap[baseName] = url.trim();
                            }
                        }
                    };

                    if (Array.isArray(data)) {
                        data.forEach(item => addMap(extractName(item), extractUrl(item)));
                    } else if (data && typeof data === 'object') {
                        const list = data.icons || data.data || data.list;
                        if (Array.isArray(list)) {
                            list.forEach(item => addMap(extractName(item), extractUrl(item)));
                        } else {
                            Object.entries(data).forEach(([k, v]) => addMap(k, extractUrl(v)));
                        }
                    }
                }
            } catch (e) {
                console.warn("⚠️ 默认 JSON 图标库加载失败：", e);
            }
            await loadLuestrIcons();
        }

        /**
         * 在图标字典中进行精确与去除数字后缀的模糊查询
         */
        function findIconInMap(key) {
            if (!key) return "";
            const lowerKey = key.toLowerCase().trim();
            if (!lowerKey || lowerKey.length < 2) return "";

            if (remoteIconsMap[lowerKey] && !isFlagKey(lowerKey, remoteIconsMap[lowerKey])) {
                return remoteIconsMap[lowerKey];
            }

            const baseKey = lowerKey.replace(/[_-]?\d+$/, "").trim();
            if (baseKey && baseKey.length >= 2 && remoteIconsMap[baseKey] && !isFlagKey(baseKey, remoteIconsMap[baseKey])) {
                return remoteIconsMap[baseKey];
            }

            for (const [iconKey, iconUrl] of Object.entries(remoteIconsMap)) {
                if (isFlagKey(iconKey, iconUrl)) continue;
                const cleanIconKey = iconKey.replace(/[_-]?\d+$/, "").trim();
                if (cleanIconKey === lowerKey || (baseKey && cleanIconKey === baseKey)) {
                    return iconUrl;
                }
            }
            return "";
        }

        /**
         * 模块名称智能图标匹配算法（包含核心应用特殊匹配、关键词净化、别名词典匹配）
         */
        function getMatchedIcon(name) {
            if (!name) return "";
            const lowerName = name.trim().toLowerCase();
            if (!lowerName) return "";

            // 1. 核心应用直接匹配
            if (lowerName.includes("youtube") || lowerName.includes("油管") || lowerName.includes("ytb")) {
                const ytIcon = findIconInMap("youtube");
                if (ytIcon && !isFlagKey("youtube", ytIcon)) return ytIcon;
            }

            if (lowerName.includes("小米") || lowerName.includes("米家") || lowerName.includes("xiaomi") || lowerName.includes("mihome")) {
                const miIcon = findIconInMap("xiaomi") || findIconInMap("mihome") || findIconInMap("mi");
                if (miIcon && !isFlagKey("xiaomi", miIcon)) return miIcon;
            }

            let matched = findIconInMap(lowerName);
            if (matched && !isFlagKey(lowerName, matched)) return matched;

            // 2. 净化模块后缀（去除“去广告”、“破解”、“签到”等噪音词后再匹配）
            const cleanName = lowerName
                .replace(/(去广告|净化|移除|破解|签到|脚本|模块|解锁|自动|净化版|修复|增强|vip|pro|lite|hd|edge|plus|v\d+)/g, "")
                .replace(/[-_.\s]/g, "")
                .trim();

            if (cleanName && cleanName.length >= 2) {
                matched = findIconInMap(cleanName);
                if (matched && !isFlagKey(cleanName, matched)) return matched;
            }

            // 3. 中文别名映射查找
            for (const [cnKeyword, enKeys] of Object.entries(APP_ALIASES)) {
                if (lowerName.includes(cnKeyword.toLowerCase())) {
                    for (const key of enKeys) {
                        matched = findIconInMap(key);
                        if (matched && !isFlagKey(key, matched)) return matched;
                    }
                }
            }

            // 4. 包含关系模糊匹配
            for (const [iconName, iconUrl] of Object.entries(remoteIconsMap)) {
                if (!iconName || iconName.length < 3 || isFlagKey(iconName, iconUrl)) continue;

                const baseIconName = iconName.replace(/[_-]?\d+$/, "").trim();
                if (baseIconName.length < 3 || isFlagKey(baseIconName, iconUrl)) continue;

                if (lowerName.includes(iconName) || lowerName.includes(baseIconName)) {
                    return iconUrl;
                }
            }

            return "";
        }

        /**
         * 规范化并转换各种格式的模块链接为标准的 Raw 直链
         */
        function normalizeRawURL(url) {
            if (!url) return "";
            let value = url.trim().replace(/^<|>$/g, "").replace(/&amp;/g, "&");
            value = value.replace(/\\([#_~`*])/g, "$1");

            // 提取带有 url= 参数或 install?module= 封装的真实链接
            if (value.includes("url=")) {
                const match = value.match(/[?&]url=([^&]+)/i) || value.match(/url=([^&]+)/i);
                if (match) {
                    try { value = decodeURIComponent(match[1]); } catch(e) {}
                }
            }
            if (value.includes("install?module=")) {
                const match = value.match(/install\?module=([^&]+)/i);
                if (match) {
                    try { value = decodeURIComponent(match[1]); } catch(e) {}
                }
            }

            value = value.replace(/#/g, "%23").replace(/\s+/g, "%20");

            // 将 github.com/blob/ 链接转换为 raw.githubusercontent.com 直链
            try {
                const parsed = new URL(value);
                if (parsed.hostname === "raw.githubusercontent.com") return parsed.href;
                if (parsed.hostname === "github.com") {
                    const parts = parsed.pathname.split("/").filter(Boolean);
                    const rawIndex = parts.indexOf("raw") !== -1 ? parts.indexOf("raw") : parts.indexOf("blob");
                    if (parts.length >= 4 && rawIndex === 2) {
                        return `https://raw.githubusercontent.com/${parts[0]}/${parts[1]}/${parts[3]}/${parts.slice(4).join("/")}${parsed.search}`;
                    }
                }
                return parsed.href;
            } catch { return value; }
        }

        /**
         * 从 Markdown 文件中通过正则解析提取所有模块链接与层级标题
         */
        function parseRepositoryModules(markdown) {
            if (!markdown) return [];
            const result = [];
            let currentHeading = "";
            const lines = markdown.split(/\r?\n/);

            for (const rawLine of lines) {
                const line = rawLine.trim();
                if (!line) continue;

                // 提取 Markdown 标题作为备用模块名
                const headingMatch = line.match(/^(?:#{1,6}|\*|-|\+)\s*(?:\[([^\]]+)\]|`([^`]+)`|([^\n(#*]+))/);
                if (headingMatch) {
                    const rawTitle = (headingMatch[1] || headingMatch[2] || headingMatch[3] || "").trim();
                    const cleanTitle = cleanText(rawTitle.replace(/[*`_#]/g, "").replace(/^[🚀📁📦\s]+/, ""));
                    if (cleanTitle && cleanTitle.length >= 2) currentHeading = cleanTitle;
                }

                let decodedLine = line;
                for (let i = 0; i < 2; i++) {
                    try {
                        const next = decodeURIComponent(decodedLine);
                        if (next === decodedLine) break;
                        decodedLine = next;
                    } catch (e) { break; }
                }

                // 正则捕获 .sgmodule / .srmodule / .module 结尾的链接
                const rawRegex = /(https?:\/\/[^\s)\]"'<>]+?\.(?:sgmodule|srmodule|module)(?:[^\s)\]"'<>]*)?)/ig;
                let match;
                while ((match = rawRegex.exec(decodedLine)) !== null) {
                    let rawURL = match[1].replace(/[),\]"'<>]+$/g, "");
                    rawURL = normalizeRawURL(rawURL);
                    if (!rawURL || !/\.(?:sgmodule|srmodule|module)(?:$|[?#%])/i.test(rawURL)) continue;

                    result.push({
                        name: getModuleNameFromURL(rawURL) || currentHeading || "未命名模块",
                        rawURL
                    });
                }
            }

            // URL 去重
            const seen = new Set();
            return result.filter(item => {
                const key = item.rawURL.toLowerCase();
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        /**
         * 拉取 fmz200 仓库模块列表
         */
        async function fetchFMZModules() {
            const modules = [];
            try {
                const res = await fetchWithTimeout(CONFIG.FMZ_TREE_API, { cache: "no-store" }, 6000);
                if (res.ok) {
                    const data = await res.json();
                    if (data && Array.isArray(data.tree)) {
                        for (const item of data.tree) {
                            const path = item.path || "";
                            if (item.type === "blob" && path.startsWith("Shadowrocket/module/") && /\.(?:sgmodule|srmodule|module)$/i.test(path)) {
                                const fileName = path.split("/").pop().replace(/\.(?:sgmodule|srmodule|module)$/i, "");
                                const rawURL = normalizeRawURL(`https://raw.githubusercontent.com/fmz200/wool_scripts/main/${path}`);
                                modules.push({ name: fileName, rawURL });
                            }
                        }
                    }
                }
            } catch (e) {
                if (e.message === "GitHub_API_Rate_Limit") console.warn("⚠️ FMZ 模块拉取受限");
            }
            return modules;
        }

        /**
         * 拉取 zirawell/R-Store 仓库模块列表
         */
        async function fetchZirawellModules() {
            const modules = [];
            try {
                const readme = await fetchRawText(CONFIG.ZIRAWELL_README_URL, false);
                const fromReadme = parseRepositoryModules(readme);
                fromReadme.forEach(m => modules.push(m));
            } catch (e) {}

            try {
                const res = await fetchWithTimeout(CONFIG.ZIRAWELL_TREE_API, { cache: "no-store" }, 6000);
                if (res.ok) {
                    const data = await res.json();
                    if (data && Array.isArray(data.tree)) {
                        for (const item of data.tree) {
                            const path = item.path || "";
                            if (item.type === "blob" && path.startsWith("Rule/Surge/") && /\.(?:sgmodule|srmodule|module)$/i.test(path)) {
                                const fileName = path.split("/").pop().replace(/\.(?:sgmodule|srmodule|module)$/i, "");
                                const rawURL = normalizeRawURL(`https://raw.githubusercontent.com/zirawell/R-Store/main/${path}`);
                                modules.push({ name: fileName, rawURL });
                            }
                        }
                    }
                }
            } catch (e) {
                if (e.message === "GitHub_API_Rate_Limit") console.warn("⚠️ Zirawell 模块拉取受限");
            }
            return modules;
        }

        function parseGitHubRawURL(rawURL) {
            try {
                const url = new URL(rawURL);
                if (url.hostname === "raw.githubusercontent.com" || url.hostname === "github.com") {
                    const parts = url.pathname.split("/").filter(Boolean);
                    if (parts.length >= 2) {
                        return { owner: parts[0], repo: parts[1], fullName: `${parts[0]}/${parts[1]}`, url: `https://github.com/${parts[0]}/${parts[1]}` };
                    }
                }
            } catch { return null; }
            return null;
        }

        function getSourceRepoInfo(rawURL, githubInfo) {
            if (githubInfo) return { name: githubInfo.repo, url: githubInfo.url };
            try {
                const url = new URL(rawURL);
                return { name: url.hostname, url: url.origin };
            } catch {
                return { name: "开源仓库", url: "#" };
            }
        }

        function getAuthorFromURL(rawURL, githubInfo) {
            if (githubInfo) return { name: githubInfo.owner, url: `https://github.com/${encodeURIComponent(githubInfo.owner)}`, username: githubInfo.owner };
            const domainName = getDomainPrimaryName(rawURL);
            if (domainName) {
                try {
                    const url = new URL(rawURL);
                    return { name: domainName, url: url.origin, username: "" };
                } catch {
                    return { name: domainName, url: "", username: "" };
                }
            }
            return { name: "作者信息识别失败", url: "", username: "" };
        }

        /* =========================================================
           模块元数据解析器 (Metadata Parser)
           解析模块前 100 行内定义的 #!name、#!desc、#!icon 等标准元数据
        ========================================================= */
        function parseModuleMetadata(text, fallbackName, rawURL = "") {
            const metadata = {};
            const lines = text.split(/\r?\n/);

            for (let i = 0; i < Math.min(lines.length, 100); i++) {
                const line = lines[i].trim();
                if (!line) continue;

                // 匹配 #!name=xxx, #!desc=xxx, #!icon=xxx
                if (line.startsWith("#!")) {
                    const match = line.match(/^#!\s*([a-zA-Z0-9_-]+)\s*=\s*(.*)$/i);
                    if (match) metadata[match[1].trim().toLowerCase()] = cleanText(match[2]);
                    continue;
                }

                // 兼容注释格式：# @name: xxx 或 // 规则名称: xxx
                const commentMatch = line.match(/^(?:#|\/\/)\s*@?(?:name|规则名称|模块名称)\s*[:=]\s*(.+)$/i);
                if (commentMatch && !metadata.name) {
                    metadata.name = cleanText(commentMatch[1]);
                }
            }

            const declaredName = metadata.name || "";
            const resolvedName = declaredName || resolveFallbackName(fallbackName, rawURL);

            return {
                name: resolvedName,
                declaredName,
                description: metadata.desc || "",
                icon: metadata.icon || ""
            };
        }

        /**
         * 生成模块描述（无描述时提取注释文本或生成通用描述）
         */
        function generateDescription(metadata, rawText) {
            if (metadata.description) return metadata.description;
            const lines = rawText.split(/\r?\n/);
            const comments = [];
            for (let i = 0; i < Math.min(lines.length, 40); i++) {
                let line = lines[i].trim();
                if (!line || line.startsWith("#!") || line.startsWith("//")) continue;
                if (line.startsWith("#")) {
                    line = line.replace(/^#+\s*/, "").trim();
                    if (line && !/^[-=*]+$/.test(line) && line.length >= 4) comments.push(line);
                }
            }
            if (comments.length) return comments.slice(0, 2).join(" ");
            return `${metadata.name}，请自行判断该模块的作用和有效性。`;
        }

        /**
         * 首字母占位应用图标生成器（返回 Data-URI 格式的高清矢量 SVG）
         */
        function createIOSAppIcon(name) {
            const cleanName = (name || "").trim();
            const char = Array.from(cleanName)[0] || "模";
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><circle cx="128" cy="128" r="128" fill="#768a9e"/><text x="128" y="132" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,SF Pro Text,sans-serif" font-size="110" font-weight="700">${escapeHTML(char)}</text></svg>`;
            return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
        }

        function resolveIconURL(icon, rawURL) {
            if (!icon) return "";
            icon = icon.trim();
            if (isFlagKey("", icon)) return "";
            if (icon.startsWith("data:")) return icon;
            if (/^https?:\/\//i.test(icon)) return normalizeRawURL(icon);
            try { 
                const safeIcon = icon.replace(/#/g, "%23").replace(/\s+/g, "%20");
                return new URL(safeIcon, rawURL).href; 
            } catch { return ""; }
        }

        // 生成 Shadowrocket 一键安装唤醒 Scheme 链接
        function createInstallURL(rawURL) { 
            return "shadowrocket://install?module=" + encodeURIComponent(rawURL); 
        }

        function getRepositoryAvatar(githubInfo) {
            return githubInfo ? `https://github.com/${encodeURIComponent(githubInfo.owner)}.png?size=64` : "";
        }

        /**
         * 单个模块数据的拉取与结构化封装
         */
        async function fetchModule(item) {
            const githubInfo = parseGitHubRawURL(item.rawURL);
            const sourceInfo = getSourceRepoInfo(item.rawURL, githubInfo);
            const urlAuthor = getAuthorFromURL(item.rawURL, githubInfo);
            const avatarUrl = getRepositoryAvatar(githubInfo);
            const fromMyRepo = item.fromMyRepo || false;

            try {
                const rawText = await fetchRawText(item.rawURL, true);
                const metadata = parseModuleMetadata(rawText, item.name, item.rawURL);
                const description = generateDescription(metadata, rawText);

                if (description && description.includes("已合并至")) return null;
                
                // 多级图标查找匹配
                let icon = resolveIconURL(metadata.icon, item.rawURL);
                if (!icon && metadata.declaredName) {
                    const matchedNameIcon = getMatchedIcon(metadata.declaredName);
                    if (matchedNameIcon) icon = resolveIconURL(matchedNameIcon, item.rawURL);
                }
                if (!icon) {
                    const fileName = getModuleNameFromURL(item.rawURL) || item.name;
                    const matchedFileIcon = getMatchedIcon(fileName);
                    if (matchedFileIcon) icon = resolveIconURL(matchedFileIcon, item.rawURL);
                }
                if (!icon && metadata.name) {
                    const fallbackMatched = getMatchedIcon(metadata.name);
                    if (fallbackMatched) icon = resolveIconURL(fallbackMatched, item.rawURL);
                }

                const isDubious = isInvalidOr404(rawText) || isInvalidOr404(description);
                let authorAvatar = urlAuthor.username
                    ? `https://github.com/${encodeURIComponent(urlAuthor.username)}.png?size=64`
                    : avatarUrl;

                // 预构建小写检索字符串，加速后续过滤
                const _searchKeywords = [metadata.name, description, urlAuthor.name, sourceInfo.name].join(" ").toLowerCase();

                return {
                    name: metadata.name,
                    rawURL: item.rawURL,
                    description,
                    author: urlAuthor,
                    authorAvatar,
                    icon,
                    sourceName: sourceInfo.name,
                    sourceURL: sourceInfo.url,
                    installURL: createInstallURL(item.rawURL),
                    isDubious,
                    fromMyRepo,
                    _searchKeywords
                };
            } catch (error) {
                // 网络异常或拉取失败时的降级方案
                const resolvedName = resolveFallbackName(item.name, item.rawURL);
                const fallbackDescription = `${resolvedName || "该模块"} 模块信息获取失败，请自行判断该模块的作用和有效性。`;
                if (fallbackDescription.includes("已合并至")) return null;

                const fallbackIconUrl = getMatchedIcon(resolvedName) ? resolveIconURL(getMatchedIcon(resolvedName), item.rawURL) : "";
                const _searchKeywords = [resolvedName, fallbackDescription, urlAuthor.name, sourceInfo.name].join(" ").toLowerCase();

                return {
                    name: resolvedName,
                    rawURL: item.rawURL,
                    description: fallbackDescription,
                    author: urlAuthor,
                    authorAvatar: avatarUrl,
                    icon: fallbackIconUrl,
                    sourceName: sourceInfo.name,
                    sourceURL: sourceInfo.url,
                    installURL: createInstallURL(item.rawURL),
                    isDubious: true,
                    fromMyRepo,
                    _searchKeywords
                };
            }
        }

        /**
         * 异步工作线程并发池 (Worker Pool)
         * 控制并发数为 CONFIG.CONCURRENCY (8)，边拉取边回调流式渲染首屏
         */
        async function processModulesStream(items, onItemLoaded) {
            const results = new Array(items.length);
            let currentIndex = 0;
            async function worker() {
                while (true) {
                    const index = currentIndex++;
                    if (index >= items.length) return;
                    const data = await fetchModule(items[index]);
                    results[index] = data;
                    if (onItemLoaded && data) onItemLoaded(data, index);
                }
            }
            const workerCount = Math.min(CONFIG.CONCURRENCY, items.length);
            const workers = Array.from({ length: workerCount }, () => worker());
            await Promise.all(workers);
            return results;
        }

        function renderAuthor(module) {
            const author = module.author || {};
            const avatar = module.authorAvatar;
            const avatarHTML = avatar ? `<img class="author-avatar" src="${escapeHTML(avatar)}" loading="lazy" alt="" onerror="this.style.display='none';">` : "";
            const authorURL = author.url || (author.username ? `https://github.com/${encodeURIComponent(author.username)}` : "");
            if (authorURL) {
                return `<a class="author" href="${escapeHTML(authorURL)}" target="_blank" rel="noopener">${avatarHTML}${escapeHTML(author.name || author.username)}</a>`;
            }
            return `<span class="author">${avatarHTML}${escapeHTML(author.name || "作者信息识别失败")}</span>`;
        }

        /**
         * 渲染单个模块卡片 DOM 节点
         */
        function createModuleCard(module, index = 0) {
            const card = document.createElement("article");
            card.className = "module-card glass-element";
            card.style.zIndex = Math.max(1, 1000 - index);

            const fallbackIcon = createIOSAppIcon(module.name);
            const icon = module.icon || fallbackIcon;
            const authorHTML = renderAuthor(module);
            
            const sourceName = module.sourceName || "开源仓库";
            const sourceURL = module.sourceURL || "#";

            const statusTextVal = module.isDubious ? "自动获取信息失败" : "已获取至最新版本";
            const statusClass = module.isDubious ? "status-badge-dubious" : "";

            card.innerHTML = `
                <div class="card-header">
                    <div class="module-icon">
                        <img src="${escapeHTML(icon)}" alt="" loading="lazy">
                    </div>
                    <div class="card-main">
                        <h2 class="module-name">${escapeHTML(module.name)}</h2>
                        <div class="module-meta">
                            ${authorHTML}
                            <span class="meta-separator">·</span>
                            <span class="status-pill ${statusClass}">${escapeHTML(statusTextVal)}</span>
                        </div>
                    </div>
                </div>
                <div class="module-description">${escapeHTML(module.description)}</div>
                <div class="card-bottom">
                    <div class="source">
                        <div class="source-icon">📍</div>
                        <div class="source-text">
                            <a href="${escapeHTML(sourceURL)}" target="_blank" rel="noopener">
                                <span>${escapeHTML(sourceName)}</span>
                            </a>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="button button-secondary copy-btn" data-url="${escapeHTML(module.rawURL)}">复制链接</button>
                        <a class="button button-primary" href="${escapeHTML(module.installURL)}">安装</a>
                    </div>
                </div>
            `;
            
            // 复制链接点击事件
            const copyBtn = card.querySelector(".copy-btn");
            if (copyBtn) {
                copyBtn.addEventListener("click", async (e) => {
                    e.preventDefault();
                    const url = copyBtn.getAttribute("data-url");
                    const success = await copyToClipboard(url);
                    showToast(success ? "已复制模块 Raw 直链" : "复制失败，请手动复制");
                });
            }
            
            // 图标加载失败时自动回退为默认首字母矢量图标
            const image = card.querySelector(".module-icon img");
            if (image) image.addEventListener("error", () => { image.src = fallbackIcon; }, { once: true });
            return card;
        }

        /**
         * 分批挂载渲染下一页模块卡片（使用 DocumentFragment 减少重排）
         */
        function appendNextBatch() {
            if (currentlyRendered >= filteredModules.length) return;
            const fragment = document.createDocumentFragment();
            const nextBatch = filteredModules.slice(currentlyRendered, currentlyRendered + CONFIG.PAGE_SIZE);
            for (let i = 0; i < nextBatch.length; i++) {
                const module = nextBatch[i];
                if (module) fragment.appendChild(createModuleCard(module, currentlyRendered + i));
            }
            modulesContainer.appendChild(fragment);
            currentlyRendered += nextBatch.length;
            requestAnimationFrame(updateCardLayerOrder);
        }

        /**
         * 重新设置并渲染过滤后的列表
         */
        function renderFilteredList(list) {
            filteredModules = sortPinnedModules(list);
            currentlyRendered = 0;
            modulesContainer.innerHTML = "";

            if (!filteredModules.length) {
                modulesContainer.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div>没有找到匹配的模块</div>`;
                countText.textContent = "0 个模块";
                return;
            }

            countText.textContent = `${filteredModules.length} 个模块`;
            appendNextBatch();
        }

        /* =========================================================
           交叉观察器（IntersectionObserver）实现无限触底加载
        ========================================================= */
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                appendNextBatch();
            }
        }, { rootMargin: "300px" });
        observer.observe(sentinel);

        /* =========================================================
           搜索输入与键盘事件处理
        ========================================================= */
        function filterModules() {
            const keyword = searchInput.value.trim().toLowerCase();
            if (searchInput.value.length > 0) {
                searchClear.classList.add("visible");
                if (searchShortcut) searchShortcut.style.display = "none";
            } else {
                searchClear.classList.remove("visible");
                if (searchShortcut) searchShortcut.style.display = "";
            }

            let result = allModules;
            if (keyword) {
                result = result.filter(m => m._searchKeywords && m._searchKeywords.includes(keyword));
            }

            renderFilteredList(result);
        }

        // 搜索框防抖输入监听
        searchInput.addEventListener("input", () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(filterModules, 120);
        });

        // 清空搜索
        searchClear.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            searchInput.value = "";
            filterModules();
            searchInput.focus();
        });

        // 全局键盘快捷键：按 '/' 键快速聚焦搜索，按 'Escape' 退出并清空搜索
        window.addEventListener("keydown", (e) => {
            if (e.key === "/" && document.activeElement !== searchInput) {
                if (searchInput.disabled) return;
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            } else if (e.key === "Escape" && document.activeElement === searchInput) {
                searchInput.value = "";
                searchInput.blur();
                filterModules();
            }
        });

        /* =========================================================
           数据引导加载核心 (Bootstrap & Cache Sync)
        ========================================================= */
        async function loadModules() {
            isPageLoading = true;
            
            // 清除旧版本或废弃的 localStorage 缓存键
            try {
                Object.keys(localStorage).forEach(key => {
                    if ((key.startsWith("sr_modules_data_") || key.startsWith("sr_modules_time_")) && 
                        key !== CONFIG.CACHE_KEY && key !== CONFIG.CACHE_TIME_KEY) {
                        localStorage.removeItem(key);
                    }
                });
            } catch (e) {}

            const svgIcon = refreshCacheBtn.querySelector("svg");
            const setBtnLoading = (isLoading) => {
                if (isLoading) {
                    refreshCacheBtn.classList.add("active");
                    if (svgIcon) svgIcon.classList.add("spin-anim");
                } else {
                    refreshCacheBtn.classList.remove("active");
                    if (svgIcon) svgIcon.classList.remove("spin-anim");
                }
            };

            const cachedData = localStorage.getItem(CONFIG.CACHE_KEY);
            const cachedTime = localStorage.getItem(CONFIG.CACHE_TIME_KEY);
            const now = Date.now();
            let hasCache = false;

            // 1. 优先读取并挂载本地缓存（秒开体验）
            if (cachedData) {
                try {
                    allModules = sortPinnedModules(JSON.parse(cachedData));
                    allModules.forEach(m => {
                        if (!m._searchKeywords) {
                            m._searchKeywords = [m.name, m.description, m.author?.name, m.sourceName].join(" ").toLowerCase();
                        }
                    });
                    renderFilteredList(allModules);
                    hasCache = true;
                    setSearchState(true);
                    
                    // 判断缓存是否在有效期内
                    const isExpired = !cachedTime || (now - Number(cachedTime) > CONFIG.CACHE_EXPIRE);
                    if (!isExpired) {
                        statusText.textContent = "已同步";
                        statusDot.className = "status-dot";
                        setBtnLoading(false); 
                        isPageLoading = false;
                        return;
                    }
                    statusText.textContent = "正在获取最新资源，请稍后...";
                    statusDot.className = "status-dot loading";
                    setBtnLoading(true); 
                } catch (e) {
                    localStorage.removeItem(CONFIG.CACHE_KEY);
                    localStorage.removeItem(CONFIG.CACHE_TIME_KEY);
                    hasCache = false;
                }
            }

            // 2. 缓存失效或无缓存时，执行全量网络拉取与解析
            try {
                if (!hasCache) {
                    setSearchState(false);
                    statusText.textContent = "正在获取资源及图标库...";
                    statusDot.className = "status-dot loading";
                    setBtnLoading(true); 
                }

                // 读取主仓库 README (含主备用地址容灾)
                let repoMarkdown = "";
                try {
                    repoMarkdown = await fetchRawText(CONFIG.REPO_README_URL, false);
                } catch (e) {}

                if (!repoMarkdown) {
                    try {
                        repoMarkdown = await fetchRawText(CONFIG.REPO_README_BACKUP, false);
                    } catch (e2) {}
                }

                // 并行拉取各开源仓库模块及远程图标库
                const [fmzModules, zirawellModules] = await Promise.all([
                    fetchFMZModules(),
                    fetchZirawellModules(),
                    loadRemoteIcons()
                ]);

                // 显式标记来自自己主仓库的模块
                const localModules = parseRepositoryModules(repoMarkdown).map(m => ({ ...m, fromMyRepo: true }));

                // 聚合去重所有模块源
                const seenURLs = new Set();
                let sourceModules = [...localModules, ...fmzModules, ...zirawellModules].filter(item => {
                    if (!item.rawURL || !/\.(?:sgmodule|srmodule|module)(?:$|[?#%])/i.test(item.rawURL) || seenURLs.has(item.rawURL.toLowerCase())) return false;
                    seenURLs.add(item.rawURL.toLowerCase());
                    return true;
                });

                if (!sourceModules.length) throw new Error("未解析到有效模块信息");

                // 对模块队列预排序，保证置顶核心模块在无缓存的首屏流式加载中率先展示
                sourceModules = sortPinnedModules(sourceModules);

                let loadedCount = 0;
                let isFirstStream = true;

                // 启动并发池流式拉取
                const results = await processModulesStream(sourceModules, (moduleData) => {
                    if (!moduleData) return;
                    loadedCount++;
                    if (!hasCache && !searchInput.value.trim()) {
                        if (isFirstStream) { 
                            modulesContainer.innerHTML = ""; 
                            isFirstStream = false; 
                        }
                        if (currentlyRendered < CONFIG.PAGE_SIZE) {
                            modulesContainer.appendChild(createModuleCard(moduleData, loadedCount - 1));
                            currentlyRendered++;
                        }
                        countText.textContent = `${loadedCount} 个模块`;
                        statusText.textContent = `加载中 (${loadedCount}/${sourceModules.length})...`;
                        requestAnimationFrame(updateCardLayerOrder);
                    }
                });

                // 全部拉取完毕，最终排序并写入缓存
                allModules = sortPinnedModules(results.filter(Boolean));
                setSearchState(true);

                if (!searchInput.value.trim()) {
                    renderFilteredList(allModules);
                }

                try {
                    localStorage.setItem(CONFIG.CACHE_KEY, JSON.stringify(allModules));
                    localStorage.setItem(CONFIG.CACHE_TIME_KEY, String(Date.now()));
                } catch (e) { console.warn("缓存写入失败：", e); }

                statusText.textContent = "已同步";
                statusDot.className = "status-dot";
                setBtnLoading(false); 

            } catch (error) {
                console.error("模块同步失败：", error);
                const isRateLimit = error.message === "GitHub_API_Rate_Limit";
                const errorMsg = isRateLimit ? "当前代理节点触发了 GitHub 速率限制，请尝试更换节点后重新加载" : (error.message || "请检查网络连接");

                if (!hasCache) {
                    setSearchState(false);
                    statusText.textContent = "同步失败";
                    statusDot.className = "status-dot error";
                    countText.textContent = "";
                    modulesContainer.innerHTML = `
                        <div class="empty">
                            <div class="empty-icon">⚠️</div>
                            无法读取模块列表
                            <div class="empty-error">${escapeHTML(errorMsg)}</div>
                        </div>`;
                    if (isRateLimit) showToast("当前节点触发 GitHub API 限制");
                } else {
                    setSearchState(true);
                    statusText.textContent = isRateLimit ? "同步中断：节点IP受限" : "同步失败，显示缓存数据";
                    statusDot.className = "status-dot error";
                    if (isRateLimit) showToast("节点IP触发 GitHub 限制，使用缓存数据");
                }
                
                setBtnLoading(false); 
            } finally {
                isPageLoading = false;
            }
        }

        // 页面脚本入口点启动
        loadModules();
    </script>
</body>
</html>
