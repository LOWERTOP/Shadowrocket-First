<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Shadowrocket 模块中心</title>

    <!-- 1. 防主题闪烁 (FOUC) 极简同步初始化 -->
    <script>
        (function() {
            const saved = localStorage.getItem("sr_theme_override");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const theme = saved === "dark" || saved === "light" ? saved : (prefersDark ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>

    <!-- 2. 浏览器标签页与 iOS 桌面图标 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/LOWERTOP/Shadowrocket-First/main/img/ShadowMods.png">

    <!-- 3. 网络层预解析 -->
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com">
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
    <link rel="dns-prefetch" href="https://data.jsdelivr.com">
    <link rel="preconnect" href="https://data.jsdelivr.com" crossorigin>

    <style>
        /* =========================================================
           Design Tokens
        ========================================================= */
        :root, [data-theme="dark"] {
            --background: #000000;
            --card: #1c1c1e;
            --card-hover: #232326;
            --card-secondary: #2c2c2e;

            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --text-tertiary: #636366;

            --blue: #0a84ff;
            --blue-hover: #409cff;

            --green: #30d158;
            --orange: #ff9f0a;
            --red: #ff453a;

            --radius-large: 22px;
            --content-width: 900px;
            
            --border-subtle: rgba(255, 255, 255, 0.08);
            --toast-bg: rgba(255, 255, 255, 0.9);
            --toast-text: #000000;
        }

        [data-theme="light"] {
            --background: #f2f2f7;
            --card: #ffffff;
            --card-hover: #f9f9fb;
            --card-secondary: #e5e5ea;

            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --text-tertiary: #aeaeb2;

            --blue: #007aff;
            --blue-hover: #0056b3;

            --green: #34c759;
            --orange: #ff9500;
            --red: #ff3b30;

            --border-subtle: rgba(0, 0, 0, 0.06);
            --toast-bg: rgba(0, 0, 0, 0.85);
            --toast-text: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { margin: 0; padding: 0; background: var(--background); transition: background-color 0.25s ease; }
        body { margin: 0; padding: max(16px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); background: var(--background); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; transition: background-color 0.25s ease, color 0.25s ease; }
        button, input { font: inherit; }
        a { color: inherit; }
        .container { width: 100%; max-width: var(--content-width); margin: 0 auto; }
        .header { padding: 24px 0 16px; }
        .header-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .title { margin: 0; font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -1px; }
        .title a { color: inherit; text-decoration: none; transition: opacity 0.2s ease; }
        .title a:hover { opacity: 0.8; }
        .theme-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .theme-toggle { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; padding: 0; margin: 0; border: 0; border-radius: 50%; background: var(--card); color: var(--text-primary); cursor: pointer; box-shadow: inset 0 0 0 1px var(--border-subtle); transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease, box-shadow 0.2s ease; }
        .theme-toggle:active { transform: scale(0.92); }
        .theme-toggle.active { color: var(--blue); box-shadow: inset 0 0 0 1.5px var(--blue); }
        .theme-toggle svg { display: block; width: 20px; height: 20px; pointer-events: none; }
        .subtitle { margin-top: 8px; color: var(--text-secondary); font-size: 15px; line-height: 1.5; }
        
        /* 可点击轮播公告栏 */
        .notice { display: flex; align-items: center; gap: 12px; height: 54px; margin-bottom: 16px; padding: 0 18px; background: var(--card); border-radius: 16px; color: var(--text-primary); font-size: 14.5px; box-shadow: inset 0 0 0 1px var(--border-subtle); overflow: hidden; cursor: pointer; user-select: none; transition: background 0.2s ease, transform 0.1s ease; }
        .notice:hover { background: var(--card-hover); }
        .notice:active { transform: scale(0.99); }
        .notice-icon { flex: 0 0 auto; font-size: 20px; line-height: 1; }
        .notice-slider { flex: 1; height: 24px; overflow: hidden; position: relative; pointer-events: none; }
        .notice-track { display: flex; flex-direction: column; transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1); }
        .notice-item { height: 24px; line-height: 24px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .search-wrapper { position: relative; margin-bottom: 14px; }
        .search-icon { position: absolute; left: 18px; top: 50%; z-index: 1; transform: translateY(-50%); color: var(--text-secondary); font-size: 18px; line-height: 1; pointer-events: none; }
        .search { display: block; width: 100%; height: 54px; padding: 0 80px 0 50px; border: 0; outline: none; border-radius: 18px; background: var(--card); color: var(--text-primary); font-size: 14.5px; box-shadow: inset 0 0 0 1px var(--border-subtle); transition: background 0.2s ease, box-shadow 0.2s ease; appearance: none; -webkit-appearance: none; }
        .search::-webkit-search-decoration, .search::-webkit-search-cancel-button, .search::-webkit-search-results-button, .search::-webkit-search-results-decoration { -webkit-appearance: none; display: none; }
        .search::placeholder { color: var(--text-secondary); }
        .search:focus { box-shadow: inset 0 0 0 1.5px var(--blue); }
        .search-shortcut { position: absolute; right: 44px; top: 50%; transform: translateY(-50%); padding: 3px 6px; border-radius: 6px; background: var(--card-secondary); color: var(--text-tertiary); font-size: 11px; font-weight: 600; pointer-events: none; transition: opacity 0.15s ease; }
        .search-clear { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); display: none; align-items: center; justify-content: center; width: 24px; height: 24px; border: 0; border-radius: 50%; background: var(--text-tertiary); color: var(--background); font-size: 13px; font-weight: bold; cursor: pointer; padding: 0; line-height: 1; transition: opacity 0.15s ease; }
        .search-clear.visible { display: flex; }

        .status { display: flex; align-items: center; justify-content: space-between; min-height: 22px; margin: 0 4px 12px; color: var(--text-tertiary); font-size: 13px; }
        .status-left { display: flex; align-items: center; gap: 7px; }
        .status-dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: var(--green); }
        .status-dot.loading { background: var(--orange); animation: statusPulse 1.2s infinite; }
        .status-dot.error { background: var(--red); }
        @keyframes statusPulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
        
        .modules { display: flex; flex-direction: column; gap: 14px; }
        .module-card { position: relative; padding: 20px 22px; border-radius: var(--radius-large); background: var(--card); box-shadow: inset 0 0 0 1px var(--border-subtle); overflow: hidden; transition: background .2s ease, transform .2s ease, box-shadow .2s ease; content-visibility: auto; contain-intrinsic-size: 0 180px; }
        .module-card:hover { background: var(--card-hover); }
        .card-header { display: flex; align-items: center; gap: 16px; }
        .module-icon { width: 70px; height: 70px; flex: 0 0 70px; border-radius: 18px; background: var(--card-secondary); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
        .module-icon img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .card-main { min-width: 0; flex: 1; }
        .module-name { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 600; letter-spacing: -.3px; word-break: break-word; }
        .module-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 6px; color: var(--text-tertiary); font-size: 13px; }
        .meta-separator { opacity: .45; }
        .status-badge-dubious { color: var(--orange); font-weight: 600; }
        .author { display: inline-flex; align-items: center; gap: 5px; color: var(--text-tertiary); text-decoration: none; }
        .author:hover { color: var(--text-secondary); }
        .author-avatar { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
        .module-description { margin-top: 14px; color: var(--text-secondary); font-size: 15.5px; line-height: 1.55; word-break: break-word; }
        .card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
        .source { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--text-tertiary); font-size: 13px; }
        .source-icon { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%; background: var(--card-secondary); color: var(--text-primary); font-size: 12px; }
        .source-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .source-text a { color: inherit; text-decoration: none; }
        .source-text a:hover { color: var(--text-secondary); text-decoration: underline; }
        .action-buttons { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .button { display: inline-flex; align-items: center; justify-content: center; height: 42px; padding: 0 18px; border: 0; border-radius: 21px; font-size: 15px; font-weight: 600; white-space: nowrap; cursor: pointer; text-decoration: none; transition: background .15s ease, transform .15s ease, opacity .15s ease; }
        .button:active { transform: scale(.95); }
        .button-secondary { background: var(--card-secondary); color: var(--blue); }
        .button-secondary:hover { opacity: 0.85; }
        .button-primary { background: var(--blue); color: #ffffff; }
        .button-primary:hover { background: var(--blue-hover); }
        
        .sentinel { height: 20px; margin: 10px 0; }
        .empty { padding: 60px 20px; text-align: center; color: var(--text-secondary); font-size: 16px; }
        .empty-icon { margin-bottom: 12px; font-size: 36px; }
        .empty-error { margin-top: 8px; color: var(--text-tertiary); font-size: 13px; }
        .loading-card { height: 190px; border-radius: var(--radius-large); background: var(--card); box-shadow: inset 0 0 0 1px var(--border-subtle); animation: skeletonPulse 1.4s infinite; }
        @keyframes skeletonPulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 0.9; } }
        .footer { padding: 32px 0 16px; color: var(--text-tertiary); text-align: center; font-size: 12px; line-height: 1.6; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); z-index: 999; padding: 10px 20px; border-radius: 20px; background: var(--toast-bg); color: var(--toast-text); font-size: 14px; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.25); opacity: 0; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease; pointer-events: none; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        @media (max-width: 600px) {
            body { padding-left: 12px; padding-right: 12px; }
            .title { font-size: 28px; }
            .module-card { padding: 18px 16px; }
            .module-icon { width: 60px; height: 60px; flex-basis: 60px; border-radius: 15px; }
            .module-name { font-size: 19px; }
            .button { height: 38px; padding: 0 14px; font-size: 14px; }
            .search-shortcut { display: none; }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-top">
                <h1 class="title">
                    <a href="https://github.com/LOWERTOP/Shadowrocket-First" target="_blank" rel="noopener">Shadowrocket 模块中心</a>
                </h1>
                <div class="theme-controls">
                    <button id="themeAuto" class="theme-toggle" aria-label="自动跟随系统"></button>
                    <button id="themeToggle" class="theme-toggle" aria-label="手动切换模式"></button>
                </div>
            </div>
            <div class="subtitle">
                相关资源均来自于开源社区，本页仅提供索引服务，所有权利归原作者所有
            </div>
        </header>

        <!-- 多信息滚动可点击公告栏 -->
        <div id="noticeBanner" class="notice" title="点击切换下一条公告">
            <div class="notice-icon">🚀</div>
            <div class="notice-slider">
                <div id="noticeTrack" class="notice-track">
                    <div class="notice-item">已启用并发缓存与快速搜索</div>
                    <div class="notice-item">首次完整加载需要一定时间，请耐心等待</div>
                </div>
            </div>
        </div>

        <div class="search-wrapper">
            <div class="search-icon">🔍</div>
            <input id="search" class="search" type="search" placeholder="输入关键字快捷搜索..." autocomplete="off" spellcheck="false">
            <span class="search-shortcut">/</span>
            <button id="searchClear" class="search-clear" title="清空搜索">✕</button>
        </div>

        <div class="status">
            <div class="status-left">
                <span id="statusDot" class="status-dot loading"></span>
                <span id="statusText">正在同步资源...</span>
            </div>
            <div id="countText"></div>
        </div>

        <main id="modules" class="modules">
            <div class="loading-card"></div>
            <div class="loading-card"></div>
            <div class="loading-card"></div>
        </main>
        
        <div id="sentinel" class="sentinel"></div>

        <footer class="footer">
            特别鸣谢开源社区创作者<br>
            著作权归资源作者所有
        </footer>
    </div>
    <div id="toast" class="toast">已复制模块链接</div>

    <script>
        /* =========================================================
           Configuration & Cache
        ========================================================= */
        const CONFIG = {
            FMZ_JSDELIVR_API: "https://data.jsdelivr.com/v1/package/gh/fmz200/wool_scripts@main/flat",
            FMZ_TREE_API: "https://api.github.com/repos/fmz200/wool_scripts/git/trees/main?recursive=1",
            REPO_README_URL: "https://raw.githubusercontent.com/LOWERTOP/Shadowrocket-First/main/README.md",
            REPO_README_BACKUP: "https://raw.githubusercontent.com/LOWERTOP/Shadowrocket-First/README/README.md",
            ZIRAWELL_README_URL: "https://raw.githubusercontent.com/zirawell/R-Store/main/README.md",
            ZIRAWELL_JSDELIVR_API: "https://data.jsdelivr.com/v1/package/gh/zirawell/R-Store@main/flat",
            ZIRAWELL_TREE_API: "https://api.github.com/repos/zirawell/R-Store/git/trees/main?recursive=1",
            ICONS_JSON_URL: "https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/icons-all.json", 
            CONCURRENCY: 12,
            PAGE_SIZE: 30,
            CACHE_KEY: "sr_modules_data_v46", 
            CACHE_TIME_KEY: "sr_modules_time_v46",
            CACHE_EXPIRE: 3600 * 6 * 1000
        };

        const APP_ALIASES = {
            "苹果": ["apple"],
            "apple": ["apple"],
            "谷歌": ["google"],
            "微软": ["microsoft"],
            "油管": ["youtube"],
            "youtube": ["youtube"],
            "电报": ["telegram"],
            "推特": ["twitter", "x"],
            "奈飞": ["netflix"],
            "网飞": ["netflix"],
            "迪士尼": ["disney"],
            "小米": ["xiaomi", "mi"],
            "米家": ["xiaomi", "mihome", "mi"],
            "xiaomi": ["xiaomi", "mi"],
            "mihome": ["xiaomi", "mihome"],
            "京东": ["jd", "jingdong"],
            "哔哩哔哩": ["bilibili", "b站"],
            "b站": ["bilibili"],
            "微信": ["weixin", "wechat"],
            "微博": ["weibo"],
            "知乎": ["zhihu"],
            "小红书": ["xhs", "xiaohongshu"],
            "抖音": ["douyin", "tiktok"],
            "快手": ["kuaishou"],
            "网易云": ["netease", "cloudmusic"],
            "百度": ["baidu"],
            "高德": ["amap", "gaode"],
            "腾讯": ["tencent"],
            "美团": ["meituan"],
            "拼多多": ["pdd", "pinduoduo"],
            "闲鱼": ["xianyu"],
            "咸鱼": ["xianyu"],
            "饿了么": ["eleme"],
            "爱奇艺": ["iqiyi"],
            "优酷": ["youku"],
            "淘宝": ["taobao"],
            "豆瓣": ["douban"],
            "贴吧": ["tieba"],
            "夸克": ["quark"],
            "12306": ["12306"],
            "高德地图": ["amap"]
        };

        const FLAG_CODES = new Set([
            "cn", "us", "hk", "tw", "jp", "kr", "sg", "uk", "gb", "de", "fr", "ca",
            "ru", "au", "mo", "vn", "th", "ph", "my", "in", "id", "br", "cl", "ar",
            "mx", "nl", "se", "no", "fi", "ch", "at", "it", "es", "pt", "tr", "ua",
            "za", "nz", "ie", "pl", "ro", "cz", "hu", "gr", "bg", "hr", "sk", "il",
            "china", "taiwan", "hongkong", "japan", "korea", "singapore", "usa",
            "united_states", "united_kingdom", "germany", "france", "russia", "australia"
        ]);

        const SYSTEM_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>`;
        const MOON_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
        const SUN_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;

        const modulesContainer = document.getElementById("modules");
        const searchInput = document.getElementById("search");
        const searchClear = document.getElementById("searchClear");
        const searchShortcut = document.querySelector(".search-shortcut");
        const statusText = document.getElementById("statusText");
        const statusDot = document.getElementById("statusDot");
        const countText = document.getElementById("countText");
        const toast = document.getElementById("toast");
        const sentinel = document.getElementById("sentinel");
        const noticeBanner = document.getElementById("noticeBanner");
        const noticeTrack = document.getElementById("noticeTrack");
        
        const themeAutoBtn = document.getElementById("themeAuto");
        const themeToggleBtn = document.getElementById("themeToggle");

        let allModules = [];
        let filteredModules = [];
        let currentlyRendered = 0;
        let searchTimer = null;
        let remoteIconsMap = {};

        /* =========================================================
           公告栏循环轮播 & 点击循环切换
        ========================================================= */
        if (noticeTrack && noticeBanner) {
            let noticeIndex = 0;
            const noticeCount = noticeTrack.children.length;
            let noticeTimer = null;

            function updateNoticePosition() {
                noticeTrack.style.transform = `translateY(-${noticeIndex * 24}px)`;
            }

            function nextNotice() {
                noticeIndex = (noticeIndex + 1) % noticeCount;
                updateNoticePosition();
            }

            function resetNoticeInterval() {
                if (noticeTimer) clearInterval(noticeTimer);
                noticeTimer = setInterval(nextNotice, 3800);
            }

            noticeBanner.addEventListener("click", () => {
                nextNotice();
                resetNoticeInterval();
            });

            resetNoticeInterval();
        }

        /* =========================================================
           Theme Engine
        ========================================================= */
        const mediaQueryDark = window.matchMedia("(prefers-color-scheme: dark)");
        themeAutoBtn.innerHTML = SYSTEM_ICON;

        function getEffectiveTheme() {
            const userChoice = localStorage.getItem("sr_theme_override");
            if (userChoice === "dark" || userChoice === "light") return userChoice;
            return mediaQueryDark.matches ? "dark" : "light";
        }

        function updateThemeUI() {
            const userChoice = localStorage.getItem("sr_theme_override");
            const isAutoMode = !userChoice;
            const currentTheme = getEffectiveTheme();
            document.documentElement.setAttribute("data-theme", currentTheme);
            if (isAutoMode) {
                themeAutoBtn.classList.add("active");
                themeAutoBtn.setAttribute("title", "已开启：自动跟随系统");
            } else {
                themeAutoBtn.classList.remove("active");
                themeAutoBtn.setAttribute("title", "点击恢复为自动跟随系统");
            }
            if (currentTheme === "dark") {
                themeToggleBtn.innerHTML = MOON_ICON;
                themeToggleBtn.setAttribute("title", "当前：深色模式（点击切换为浅色）");
            } else {
                themeToggleBtn.innerHTML = SUN_ICON;
                themeToggleBtn.setAttribute("title", "当前：浅色模式（点击切换为深色）");
            }
        }

        mediaQueryDark.addEventListener("change", () => {
            if (!localStorage.getItem("sr_theme_override")) updateThemeUI();
        });

        themeAutoBtn.addEventListener("click", () => {
            localStorage.removeItem("sr_theme_override");
            updateThemeUI();
            showToast("已恢复自动跟随系统");
        });

        themeToggleBtn.addEventListener("click", () => {
            const currentTheme = getEffectiveTheme();
            const nextTheme = currentTheme === "dark" ? "light" : "dark";
            localStorage.setItem("sr_theme_override", nextTheme);
            updateThemeUI();
            showToast(`已切换为${nextTheme === "dark" ? "深色" : "浅色"}模式`);
        });

        updateThemeUI();

        /* =========================================================
           Utilities & Network Resilience
        ========================================================= */
        function escapeHTML(value) {
            return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function cleanText(value) {
            return String(value ?? "").replace(/\\n/g, " ").replace(/\\r/g, "").replace(/\\t/g, " ").replace(/\s+/g, " ").trim();
        }

        function showToast(text) {
            toast.textContent = text;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 2000);
        }

        async function copyToClipboard(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {}
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            let success = false;
            try { success = document.execCommand("copy"); } catch (e) {}
            document.body.removeChild(textArea);
            return success;
        }

        function getDomainPrimaryName(rawURL) {
            if (!rawURL) return "";
            try {
                const url = new URL(rawURL);
                const host = url.hostname.toLowerCase();
                if (/^(\d{1,3}\.){3}\d{1,3}$/.test(host) || host === "localhost" || host.includes(":")) {
                    return host;
                }
                const cleanHost = host.replace(/^www\./, "");
                const parts = cleanHost.split(".");
                if (parts.length >= 2) {
                    const secondLevelTlds = new Set(["com", "org", "net", "edu", "gov", "co", "ac", "biz", "info"]);
                    if (parts.length >= 3 && secondLevelTlds.has(parts[parts.length - 2])) {
                        return parts[parts.length - 3];
                    }
                    return parts[parts.length - 2];
                }
                return parts[0] || host;
            } catch {
                return "";
            }
        }

        function getModuleNameFromURL(rawURL) {
            if (!rawURL) return "";
            try {
                const cleanURL = String(rawURL).split(/[?#]/)[0];
                const parts = cleanURL.split("/").filter(Boolean);
                const last = parts.pop() || "";
                let decoded = decodeURIComponent(last);
                decoded = decoded.replace(/\.(?:sgmodule|srmodule|module)$/i, "").trim();
                return decoded;
            } catch {
                return "";
            }
        }

        function resolveFallbackName(fallbackName, rawURL) {
            if (fallbackName && fallbackName !== "未命名模块" && fallbackName.trim()) {
                return fallbackName.trim();
            }
            const urlName = getModuleNameFromURL(rawURL);
            return urlName || "未命名模块";
        }

        function isFlagKey(key, url = "") {
            if (!key && !url) return false;
            const k = (key || "").toLowerCase().trim();
            const u = (url || "").toLowerCase().trim();
            if (FLAG_CODES.has(k)) return true;
            const flagKeywords = ["flag", "flags", "国旗", "node", "节点", "country", "countries", "region", "regions", "geoip"];
            if (flagKeywords.some(w => k.includes(w) || u.includes(w))) return true;
            if (/\/(?:flags?|countries|regions|country)\//i.test(u)) return true;
            if (/[_\-/](?:cn|us|hk|tw|jp|kr|sg|gb|uk|de|fr|ru|au|mo|ca)\.(?:png|jpg|jpeg|svg|webp)/i.test(u)) return true;
            return false;
        }

        function isInvalidOr404(text) {
            if (!text) return false;
            const t = String(text);
            return /404\s*:\s*Not\s*Found/i.test(t) ||
                   /404\s+Not\s+Found/i.test(t) ||
                   /Cannot\s+GET/i.test(t) ||
                   /(?:已失效|此模块已失效|资源已失效|链接已失效|文件已删除|文件不存在|404\s*失效)/i.test(t);
        }

        async function fetchWithTimeout(url, options = {}, timeoutMs = 6000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(timer);
                return response;
            } catch (err) {
                clearTimeout(timer);
                throw err;
            }
        }

        async function fetchRawText(url, isPartial = true) {
            if (isPartial) {
                try {
                    const response = await fetchWithTimeout(url, { headers: { 'Range': 'bytes=0-2047' }, cache: "no-store" }, 4500);
                    if (response.status === 404) return "404: Not Found";
                    if (response.ok || response.status === 206) return await response.text();
                } catch (e) {}
            }
            try {
                const fallbackRes = await fetchWithTimeout(url, { cache: "no-store" }, 6000);
                if (fallbackRes.status === 404) return "404: Not Found";
                if (fallbackRes.ok) return await fallbackRes.text();
            } catch (err) {}
            throw new Error(`无法获取资源: ${url}`);
        }

        /* =========================================================
           图标解析与匹配
        ========================================================= */
        async function loadRemoteIcons() {
            try {
                const response = await fetchWithTimeout(CONFIG.ICONS_JSON_URL, { cache: "no-store" }, 6000);
                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                const data = await response.json();
                
                const extractUrl = (item) => {
                    if (typeof item === 'string') return item;
                    if (typeof item === 'object' && item !== null) {
                        return item.icon || item.url || item.src || item.img || item.path || item.link || "";
                    }
                    return "";
                };

                const extractName = (item) => {
                    if (typeof item === 'object' && item !== null) {
                        return item.name || item.title || item.label || item.id || item.app || "";
                    }
                    return "";
                };

                const addMap = (name, url) => {
                    if (name && typeof name === 'string' && url && typeof url === 'string' && url.length > 5) {
                        if (isFlagKey(name, url)) return;

                        const cleanName = name.trim().toLowerCase();
                        if (cleanName.length < 2) return;

                        remoteIconsMap[cleanName] = url.trim();

                        const baseName = cleanName.replace(/[_-]?\d+$/, "").trim();
                        if (baseName && baseName.length >= 2 && !remoteIconsMap[baseName]) {
                            remoteIconsMap[baseName] = url.trim();
                        }
                    }
                };

                if (Array.isArray(data)) {
                    data.forEach(item => addMap(extractName(item), extractUrl(item)));
                } else if (data && typeof data === 'object') {
                    const list = data.icons || data.data || data.list;
                    if (Array.isArray(list)) {
                        list.forEach(item => addMap(extractName(item), extractUrl(item)));
                    } else {
                        Object.entries(data).forEach(([k, v]) => addMap(k, extractUrl(v)));
                    }
                }
            } catch (e) {
                console.warn("⚠️ 远程图标库加载失败：", e);
            }
        }

        function findIconInMap(key) {
            if (!key) return "";
            const lowerKey = key.toLowerCase().trim();
            if (!lowerKey || lowerKey.length < 2) return "";

            if (remoteIconsMap[lowerKey] && !isFlagKey(lowerKey, remoteIconsMap[lowerKey])) {
                return remoteIconsMap[lowerKey];
            }

            const baseKey = lowerKey.replace(/[_-]?\d+$/, "").trim();
            if (baseKey && baseKey.length >= 2 && remoteIconsMap[baseKey] && !isFlagKey(baseKey, remoteIconsMap[baseKey])) {
                return remoteIconsMap[baseKey];
            }

            for (const [iconKey, iconUrl] of Object.entries(remoteIconsMap)) {
                if (isFlagKey(iconKey, iconUrl)) continue;
                const cleanIconKey = iconKey.replace(/[_-]?\d+$/, "").trim();
                if (cleanIconKey === lowerKey || (baseKey && cleanIconKey === baseKey)) {
                    return iconUrl;
                }
            }
            return "";
        }

        function getMatchedIcon(name) {
            if (!name) return "";
            const lowerName = name.trim().toLowerCase();
            if (!lowerName) return "";

            if (lowerName.includes("youtube") || lowerName.includes("油管") || lowerName.includes("ytb")) {
                const ytIcon = findIconInMap("youtube");
                if (ytIcon && !isFlagKey("youtube", ytIcon)) return ytIcon;
            }

            if (lowerName.includes("小米") || lowerName.includes("米家") || lowerName.includes("xiaomi") || lowerName.includes("mihome")) {
                const miIcon = findIconInMap("xiaomi") || findIconInMap("mihome") || findIconInMap("mi");
                if (miIcon && !isFlagKey("xiaomi", miIcon)) return miIcon;
            }

            let matched = findIconInMap(lowerName);
            if (matched && !isFlagKey(lowerName, matched)) return matched;

            const cleanName = lowerName
                .replace(/(去广告|净化|移除|破解|签到|脚本|模块|解锁|自动|净化版|修复|增强|vip|pro|lite|hd|edge|plus|v\d+)/g, "")
                .replace(/[-_.\s]/g, "")
                .trim();

            if (cleanName && cleanName.length >= 2) {
                matched = findIconInMap(cleanName);
                if (matched && !isFlagKey(cleanName, matched)) return matched;
            }

            for (const [cnKeyword, enKeys] of Object.entries(APP_ALIASES)) {
                if (lowerName.includes(cnKeyword.toLowerCase())) {
                    for (const key of enKeys) {
                        matched = findIconInMap(key);
                        if (matched && !isFlagKey(key, matched)) return matched;
                    }
                }
            }

            for (const [iconName, iconUrl] of Object.entries(remoteIconsMap)) {
                if (!iconName || iconName.length < 3 || isFlagKey(iconName, iconUrl)) continue;

                const baseIconName = iconName.replace(/[_-]?\d+$/, "").trim();
                if (baseIconName.length < 3 || isFlagKey(baseIconName, iconUrl)) continue;

                if (lowerName.includes(iconName) || lowerName.includes(baseIconName)) {
                    return iconUrl;
                }
            }

            return "";
        }

        function normalizeRawURL(url) {
            if (!url) return "";
            let value = url.trim().replace(/^<|>$/g, "").replace(/&amp;/g, "&");
            value = value.replace(/\\([#_~`*])/g, "$1");

            if (value.includes("url=")) {
                const match = value.match(/[?&]url=([^&]+)/i) || value.match(/url=([^&]+)/i);
                if (match) {
                    try { value = decodeURIComponent(match[1]); } catch(e) {}
                }
            }
            if (value.includes("install?module=")) {
                const match = value.match(/install\?module=([^&]+)/i);
                if (match) {
                    try { value = decodeURIComponent(match[1]); } catch(e) {}
                }
            }

            value = value.replace(/#/g, "%23").replace(/\s+/g, "%20");

            try {
                const parsed = new URL(value);
                if (parsed.hostname === "raw.githubusercontent.com") return parsed.href;
                if (parsed.hostname === "github.com") {
                    const parts = parsed.pathname.split("/").filter(Boolean);
                    const rawIndex = parts.indexOf("raw") !== -1 ? parts.indexOf("raw") : parts.indexOf("blob");
                    if (parts.length >= 4 && rawIndex === 2) {
                        return `https://raw.githubusercontent.com/${parts[0]}/${parts[1]}/${parts[3]}/${parts.slice(4).join("/")}${parsed.search}`;
                    }
                }
                return parsed.href;
            } catch { return value; }
        }

        /* =========================================================
           Markdown & 仓库模块扫描
        ========================================================= */
        function parseRepositoryModules(markdown) {
            if (!markdown) return [];
            const result = [];
            let currentHeading = "";
            const lines = markdown.split(/\r?\n/);

            for (const rawLine of lines) {
                const line = rawLine.trim();
                if (!line) continue;

                const headingMatch = line.match(/^(?:#{1,6}|\*|-|\+)\s*(?:\[([^\]]+)\]|`([^`]+)`|([^\n(#*]+))/);
                if (headingMatch) {
                    const rawTitle = (headingMatch[1] || headingMatch[2] || headingMatch[3] || "").trim();
                    const cleanTitle = cleanText(rawTitle.replace(/[*`_#]/g, "").replace(/^[🚀📁📦\s]+/, ""));
                    if (cleanTitle && cleanTitle.length >= 2) currentHeading = cleanTitle;
                }

                let decodedLine = line;
                for (let i = 0; i < 2; i++) {
                    try {
                        const next = decodeURIComponent(decodedLine);
                        if (next === decodedLine) break;
                        decodedLine = next;
                    } catch (e) { break; }
                }

                const rawRegex = /(https?:\/\/[^\s)\]"'<>]+?\.(?:sgmodule|srmodule|module)(?:[^\s)\]"'<>]*)?)/ig;
                let match;
                while ((match = rawRegex.exec(decodedLine)) !== null) {
                    let rawURL = match[1].replace(/[),\]"'<>]+$/g, "");
                    rawURL = normalizeRawURL(rawURL);
                    if (!rawURL || !/\.(?:sgmodule|srmodule|module)(?:$|[?#%])/i.test(rawURL)) continue;

                    result.push({
                        name: getModuleNameFromURL(rawURL) || currentHeading || "未命名模块",
                        rawURL
                    });
                }
            }

            const seen = new Set();
            return result.filter(item => {
                const key = item.rawURL.toLowerCase();
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

                    const data = await res.json();
                    if (data && Array.isArray(data.files)) {
                        for (const file of data.files) {
                            const path = file.name || "";
                            if (path.startsWith("/Shadowrocket/module/") && /\.(?:sgmodule|srmodule|module)$/i.test(path)) {
                                const fileName = path.split("/").pop().replace(/\.(?:sgmodule|srmodule|module)$/i, "");
                                const rawURL = normalizeRawURL(`https://raw.githubusercontent.com/fmz200/wool_scripts/main${path}`);
                                modules.push({ name: fileName, rawURL });

                    }
                }
            } catch (e) {}

            if (!modules.length) {
                try {
                    const res = await fetchWithTimeout(CONFIG.FMZ_TREE_API, { cache: "no-store" }, 6000);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && Array.isArray(data.tree)) {

        /* =========================================================
           元数据与模块实体构建
        ========================================================= */
        function parseGitHubRawURL(rawURL) {
            try {
                const url = new URL(rawURL);
                if (url.hostname === "raw.githubusercontent.com" || url.hostname === "github.com") {
                    const parts = url.pathname.split("/").filter(Boolean);
                    if (parts.length >= 2) {
                        return { owner: parts[0], repo: parts[1], fullName: `${parts[0]}/${parts[1]}`, url: `https://github.com/${parts[0]}/${parts[1]}` };
                    }
                }
                if (url.hostname.includes("jsdelivr.net")) {
                    const match = url.pathname.match(/\/gh\/([^/@]+)\/([^/@]+)/i);
                    if (match) {
                        return { owner: match[1], repo: match[2], fullName: `${match[1]}/${match[2]}`, url: `https://github.com/${match[1]}/${match[2]}` };
                    }
                }
            } catch { return null; }
            return null;
        }

        function getSourceRepoInfo(rawURL) {
            const githubInfo = parseGitHubRawURL(rawURL);
            if (githubInfo) return { name: githubInfo.fullName, url: githubInfo.url };
            try {
                const url = new URL(rawURL);
                return { name: url.hostname, url: url.origin };
            } catch {
                return { name: "开源仓库", url: "#" };
            }
        }

        function getAuthorFromURL(rawURL) {
            const info = parseGitHubRawURL(rawURL);
            if (info) return { name: info.owner, url: `https://github.com/${encodeURIComponent(info.owner)}`, username: info.owner };
            const domainName = getDomainPrimaryName(rawURL);
            if (domainName) {
                try {
                    const url = new URL(rawURL);
                    return { name: domainName, url: url.origin, username: "" };
                } catch {
                    return { name: domainName, url: "", username: "" };
                }
            }
            return { name: "未识别作者", url: "", username: "" };
        }

        function parseModuleMetadata(text, fallbackName, rawURL = "") {
            const metadata = {};
            const lines = text.split(/\r?\n/);

            for (let i = 0; i < Math.min(lines.length, 100); i++) {
                const line = lines[i].trim();
                if (!line) continue;

                if (line.startsWith("#!")) {
                    const match = line.match(/^#!\s*([a-zA-Z0-9_-]+)\s*=\s*(.*)$/i);
                    if (match) metadata[match[1].trim().toLowerCase()] = cleanText(match[2]);
                    continue;
                }

                const commentMatch = line.match(/^(?:#|\/\/)\s*@?(?:name|规则名称|模块名称)\s*[:=]\s*(.+)$/i);
                if (commentMatch && !metadata.name) {
                    metadata.name = cleanText(commentMatch[1]);
                }
            }

            const declaredName = metadata.name || "";
            const resolvedName = declaredName || resolveFallbackName(fallbackName, rawURL);

            return {
                name: resolvedName,
                declaredName,
                description: metadata.desc || "",
                icon: metadata.icon || ""
            };
        }

        function generateDescription(metadata, rawText) {
            if (metadata.description) return metadata.description;
            const lines = rawText.split(/\r?\n/);
            const comments = [];
            for (let i = 0; i < Math.min(lines.length, 40); i++) {
                let line = lines[i].trim();
                if (!line || line.startsWith("#!") || line.startsWith("//")) continue;
                if (line.startsWith("#")) {
                    line = line.replace(/^#+\s*/, "").trim();
                    if (line && !/^[-=*]+$/.test(line) && line.length >= 4) comments.push(line);
                }
            }
            if (comments.length) return comments.slice(0, 2).join(" ");
            return `${metadata.name}，适用于 Shadowrocket 的网络模块。`;
        }

        function hashString(value) {
            let hash = 0;
            for (let i = 0; i < value.length; i++) hash = ((hash << 5) - hash + value.charCodeAt(i)) | 0;
            return Math.abs(hash);
        }

        function createIOSAppIcon(name) {
            const cleanName = (name || "").trim();
            const char = Array.from(cleanName)[0] || "模";
            const hash = hashString(cleanName);
            const hue1 = hash % 360, hue2 = (hue1 + 35 + (hash % 30)) % 360;
            const color1 = `hsl(${hue1}, 52%, 68%)`, color2 = `hsl(${hue2}, 55%, 58%)`;
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><defs><linearGradient id="g_${hash}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${color1}"/><stop offset="100%" stop-color="${color2}"/></linearGradient></defs><rect width="256" height="256" rx="58" ry="58" fill="url(#g_${hash})"/><text x="128" y="132" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,SF Pro Text,sans-serif" font-size="110" font-weight="700">${escapeHTML(char)}</text></svg>`;
            return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
        }

        function resolveIconURL(icon, rawURL) {
            if (!icon) return "";
            icon = icon.trim();
            if (isFlagKey("", icon)) return "";
            if (icon.startsWith("data:")) return icon;
            if (/^https?:\/\//i.test(icon)) return normalizeRawURL(icon);
            try { 
                const safeIcon = icon.replace(/#/g, "%23").replace(/\s+/g, "%20");
                return new URL(safeIcon, rawURL).href; 
            } catch { return ""; }
        }

        function createInstallURL(rawURL) { 
            return "shadowrocket://install?module=" + encodeURIComponent(rawURL); 
        }

        function getRepositoryAvatar(rawURL) {
            const info = parseGitHubRawURL(rawURL);
            return info ? `https://github.com/${encodeURIComponent(info.owner)}.png?size=64` : "";
        }

        /* =========================================================
           Fetch Single Module
        ========================================================= */
        async function fetchModule(item) {
            const sourceInfo = getSourceRepoInfo(item.rawURL);
            const urlAuthor = getAuthorFromURL(item.rawURL);

            try {
                const rawText = await fetchRawText(item.rawURL, true);
                const metadata = parseModuleMetadata(rawText, item.name, item.rawURL);
                const description = generateDescription(metadata, rawText);

                if (description && description.includes("已合并至")) return null;
                
                let icon = resolveIconURL(metadata.icon, item.rawURL);
                if (!icon && metadata.declaredName) {
                    const matchedNameIcon = getMatchedIcon(metadata.declaredName);
                    if (matchedNameIcon) icon = resolveIconURL(matchedNameIcon, item.rawURL);
                }
                if (!icon) {
                    const fileName = getModuleNameFromURL(item.rawURL) || item.name;
                    const matchedFileIcon = getMatchedIcon(fileName);
                    if (matchedFileIcon) icon = resolveIconURL(matchedFileIcon, item.rawURL);
                }
                if (!icon && metadata.name) {
                    const fallbackMatched = getMatchedIcon(metadata.name);
                    if (fallbackMatched) icon = resolveIconURL(fallbackMatched, item.rawURL);
                }

                const isDubious = isInvalidOr404(rawText) || isInvalidOr404(description);
                let authorAvatar = urlAuthor.username
                    ? `https://github.com/${encodeURIComponent(urlAuthor.username)}.png?size=64`
                    : getRepositoryAvatar(item.rawURL);

                const _searchKeywords = [metadata.name, description, urlAuthor.name, sourceInfo.name].join(" ").toLowerCase();

                return {
                    name: metadata.name,
                    rawURL: item.rawURL,
                    description,
                    author: urlAuthor,
                    authorAvatar,
                    icon,
                    sourceName: sourceInfo.name,
                    sourceURL: sourceInfo.url,
                    installURL: createInstallURL(item.rawURL),
                    isDubious,
                    _searchKeywords
                };
            } catch (error) {
                const resolvedName = resolveFallbackName(item.name, item.rawURL);
                const fallbackDescription = `${resolvedName || "该模块"}，适用于 Shadowrocket 的网络模块。`;
                if (fallbackDescription.includes("已合并至")) return null;

                const fallbackIconUrl = getMatchedIcon(resolvedName) ? resolveIconURL(getMatchedIcon(resolvedName), item.rawURL) : "";
                const _searchKeywords = [resolvedName, fallbackDescription, urlAuthor.name, sourceInfo.name].join(" ").toLowerCase();

                return {
                    name: resolvedName,
                    rawURL: item.rawURL,
                    description: fallbackDescription,
                    author: urlAuthor,
                    authorAvatar: getRepositoryAvatar(item.rawURL),
                    icon: fallbackIconUrl,
                    sourceName: sourceInfo.name,
                    sourceURL: sourceInfo.url,
                    installURL: createInstallURL(item.rawURL),
                    isDubious: true,
                    _searchKeywords
                };
            }
        }

        async function processModulesStream(items, onItemLoaded) {
            const results = new Array(items.length);
            let currentIndex = 0;
            async function worker() {
                while (true) {
                    const index = currentIndex++;
                    if (index >= items.length) return;
                    const data = await fetchModule(items[index]);
                    results[index] = data;
                    if (onItemLoaded && data) onItemLoaded(data, index);
                }
            }
            const workerCount = Math.min(CONFIG.CONCURRENCY, items.length);
            const workers = Array.from({ length: workerCount }, () => worker());
            await Promise.all(workers);
            return results;
        }

        /* =========================================================
           分批渲染与卡片创建
        ========================================================= */
        function renderAuthor(module) {
            const author = module.author || {};
            const avatar = module.authorAvatar;
            const avatarHTML = avatar ? `<img class="author-avatar" src="${escapeHTML(avatar)}" loading="lazy" alt="" onerror="this.style.display='none';">` : "";
            const authorURL = author.url || (author.username ? `https://github.com/${encodeURIComponent(author.username)}` : "");
            if (authorURL) {
                return `<a class="author" href="${escapeHTML(authorURL)}" target="_blank" rel="noopener">${avatarHTML}${escapeHTML(author.name || author.username)}</a>`;
            }
            return `<span class="author">${avatarHTML}${escapeHTML(author.name || "未识别作者")}</span>`;
        }

        function createModuleCard(module) {
            const card = document.createElement("article");
            card.className = "module-card";
            const fallbackIcon = createIOSAppIcon(module.name);
            const icon = module.icon || fallbackIcon;
            const authorHTML = renderAuthor(module);
            
            const sourceInfo = getSourceRepoInfo(module.rawURL);
            const sourceName = module.sourceName || sourceInfo.name;
            const sourceURL = module.sourceURL || sourceInfo.url;

            const statusTextVal = module.isDubious ? "模块信息获取失败" : "已获取到最新版本";
            const statusClass = module.isDubious ? "status-badge-dubious" : "";

            card.innerHTML = `
                <div class="card-header">
                    <div class="module-icon">
                        <img src="${escapeHTML(icon)}" alt="" loading="lazy">
                    </div>
                    <div class="card-main">
                        <h2 class="module-name">${escapeHTML(module.name)}</h2>
                        <div class="module-meta">
                            ${authorHTML}
                            <span class="meta-separator">·</span>
                            <span class="${statusClass}">${escapeHTML(statusTextVal)}</span>
                        </div>
                    </div>
                </div>
                <div class="module-description">${escapeHTML(module.description)}</div>
                <div class="card-bottom">
                    <div class="source">
                        <div class="source-icon">🚀</div>
                        <div class="source-text"><a href="${escapeHTML(sourceURL)}" target="_blank" rel="noopener">${escapeHTML(sourceName)}</a></div>
                    </div>
                    <div class="action-buttons">
                        <button class="button button-secondary copy-btn" data-url="${escapeHTML(module.rawURL)}">复制链接</button>
                        <a class="button button-primary" href="${escapeHTML(module.installURL)}">安装</a>
                    </div>
                </div>
            `;
            const copyBtn = card.querySelector(".copy-btn");
            if (copyBtn) {
                copyBtn.addEventListener("click", async (e) => {
                    e.preventDefault();
                    const url = copyBtn.getAttribute("data-url");
                    const success = await copyToClipboard(url);
                    showToast(success ? "已复制模块 Raw 直链" : "复制失败，请手动复制");
                });
            }
            const image = card.querySelector(".module-icon img");
            if (image) image.addEventListener("error", () => { image.src = fallbackIcon; }, { once: true });
            return card;
        }

        function appendNextBatch() {
            if (currentlyRendered >= filteredModules.length) return;
            const fragment = document.createDocumentFragment();
            const nextBatch = filteredModules.slice(currentlyRendered, currentlyRendered + CONFIG.PAGE_SIZE);
            for (const module of nextBatch) {
                if (module) fragment.appendChild(createModuleCard(module));
            }
            modulesContainer.appendChild(fragment);
            currentlyRendered += nextBatch.length;
        }

        function renderFilteredList(list) {
            filteredModules = list;
            currentlyRendered = 0;
            modulesContainer.innerHTML = "";

            if (!filteredModules.length) {
                modulesContainer.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div>没有找到匹配的模块</div>`;
                countText.textContent = "0 个模块";
                return;
            }

            countText.textContent = `${filteredModules.length} 个模块`;
            appendNextBatch();
        }

        /* 触底自动追加 */
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                appendNextBatch();
            }
        }, { rootMargin: "300px" });
        observer.observe(sentinel);

        /* =========================================================
           Search & Shortcuts
        ========================================================= */
        function filterModules() {
            const keyword = searchInput.value.trim().toLowerCase();
            if (searchInput.value.length > 0) {
                searchClear.classList.add("visible");
                if (searchShortcut) searchShortcut.style.display = "none";
            } else {
                searchClear.classList.remove("visible");
                if (searchShortcut) searchShortcut.style.display = "";
            }

            let result = allModules;
            if (keyword) {
                result = result.filter(m => m._searchKeywords && m._searchKeywords.includes(keyword));
            }

            renderFilteredList(result);
        }

        searchInput.addEventListener("input", () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(filterModules, 120);
        });

        searchClear.addEventListener("click", () => {
            searchInput.value = "";
            filterModules();
            searchInput.focus();
        });

        window.addEventListener("keydown", (e) => {
            if (e.key === "/" && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            } else if (e.key === "Escape" && document.activeElement === searchInput) {
                searchInput.value = "";
                searchInput.blur();
                filterModules();
            }
        });

        /* =========================================================
           主加载调度引擎
        ========================================================= */
        async function loadModules() {
            const cachedData = localStorage.getItem(CONFIG.CACHE_KEY);
            const cachedTime = localStorage.getItem(CONFIG.CACHE_TIME_KEY);
            const now = Date.now();
            let hasCache = false;

            if (cachedData) {
                try {
                    allModules = JSON.parse(cachedData);
                    allModules.forEach(m => {
                        if (!m._searchKeywords) {
                            m._searchKeywords = [m.name, m.description, m.author?.name, m.sourceName].join(" ").toLowerCase();
                        }
                    });
                    renderFilteredList(allModules);
                    hasCache = true;
                    const isExpired = !cachedTime || (now - Number(cachedTime) > CONFIG.CACHE_EXPIRE);
                    if (!isExpired) {
                        statusText.textContent = "已同步";
                        statusDot.className = "status-dot";
                        return;
                    }
                    statusText.textContent = "正在同步模块...";
                    statusDot.className = "status-dot loading";
                } catch (e) {
                    localStorage.removeItem(CONFIG.CACHE_KEY);
                    localStorage.removeItem(CONFIG.CACHE_TIME_KEY);
                    hasCache = false;
                }
            }

            try {
                if (!hasCache) {
                    statusText.textContent = "正在读取模块及图标库...";
                    statusDot.className = "status-dot loading";
                }

                let repoMarkdown = "";
                try {
                    repoMarkdown = await fetchRawText(CONFIG.REPO_README_URL, false);
                } catch (e) {
                    try {
                        repoMarkdown = await fetchRawText(CONFIG.REPO_README_BACKUP, false);
                    } catch (e2) {}
                }

                const [fmzModules, zirawellModules] = await Promise.all([
                    fetchFMZModules(),
                    fetchZirawellModules(),
                    loadRemoteIcons()
                ]);

                const localModules = parseRepositoryModules(repoMarkdown);

                const seenURLs = new Set();
                const sourceModules = [...localModules, ...zirawellModules, ...fmzModules].filter(item => {
                    if (!item.rawURL || !/\.(?:sgmodule|srmodule|module)(?:$|[?#%])/i.test(item.rawURL) || seenURLs.has(item.rawURL.toLowerCase())) return false;
                    seenURLs.add(item.rawURL.toLowerCase());
                    return true;
                });

                if (!sourceModules.length) throw new Error("未解析到有效模块信息");

                let loadedCount = 0;
                let isFirstStream = true;

                const results = await processModulesStream(sourceModules, (moduleData) => {
                    if (!moduleData) return;
                    loadedCount++;
                    if (!hasCache && !searchInput.value.trim()) {
                        if (isFirstStream) { 
                            modulesContainer.innerHTML = ""; 
                            isFirstStream = false; 
                        }
                        if (currentlyRendered < CONFIG.PAGE_SIZE) {
                            modulesContainer.appendChild(createModuleCard(moduleData));
                            currentlyRendered++;
                        }
                        countText.textContent = `${loadedCount} 个模块`;
                        statusText.textContent = `加载中 (${loadedCount}/${sourceModules.length})...`;
                    }
                });

                allModules = results.filter(Boolean);
                if (!searchInput.value.trim()) {
                    renderFilteredList(allModules);
                }

                try {
                    localStorage.setItem(CONFIG.CACHE_KEY, JSON.stringify(allModules));
                    localStorage.setItem(CONFIG.CACHE_TIME_KEY, String(Date.now()));
                } catch (e) { console.warn("缓存写入失败：", e); }

                statusText.textContent = "已同步";
                statusDot.className = "status-dot";

            } catch (error) {
                console.error("模块同步失败：", error);
                if (!hasCache) {
                    statusText.textContent = "同步失败";
                    statusDot.className = "status-dot error";
                    countText.textContent = "";
                    modulesContainer.innerHTML = `
                        <div class="empty">
                            <div class="empty-icon">⚠️</div>
                            无法读取模块列表
                            <div class="empty-error">${escapeHTML(error.message || "请检查网络连接")}</div>
                        </div>`;
                } else {
                    statusText.textContent = "已同步";
                    statusDot.className = "status-dot";
                }
            }
        }

        /* Start */
        loadModules();
    </script>
</body>
</html>
