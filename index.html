<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shadowrocket 配色与配置</title>
  
  <!-- 标签页图标 -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/LOWERTOP/Shadowrocket-First/main/img/Shadowrocket.png" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/LOWERTOP/Shadowrocket-First/main/img/ShadowTrans.PNG" />

  <!-- Tailwind CSS & Lucide 图标 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Markdown 解析与语法高亮 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#0ea5e9', 600: '#0284c7' }
          }
        }
      }
    }
  </script>
  <style>
    /* 全局重置与防横向滑动 */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-x: hidden;
      width: 100%;
      max-width: 100vw;
    }
    html.dark { color-scheme: dark; }

    body {
      margin: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      position: relative;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      height: 100dvh;
      min-height: 100dvh;
      width: 100%;
      max-width: 100vw;
      overflow: hidden;
      position: relative;
    }

    #content-container {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      overscroll-behavior-x: none;
    }

    #toc-tree {
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* 正文排版与防撑破机制 */
    .markdown-body {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-wrap: break-word;
      word-wrap: break-word;
    }

    .markdown-body h1 { font-size: 1.75rem; font-weight: 700; margin-top: 1.75rem; margin-bottom: 0.85rem; padding-bottom: 0.4rem; border-bottom: 1px solid #e2e8f0; scroll-margin-top: 1.5rem; overflow-wrap: anywhere; }
    .markdown-body h2 { font-size: 1.35rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.65rem; padding-bottom: 0.3rem; border-bottom: 1px solid #f1f5f9; scroll-margin-top: 1.5rem; overflow-wrap: anywhere; }
    .markdown-body h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.45rem; scroll-margin-top: 1.5rem; overflow-wrap: anywhere; }
    .dark .markdown-body h1, .dark .markdown-body h2 { border-color: #334155; }
    
    .markdown-body p,
    .markdown-body li,
    .markdown-body blockquote {
      margin-bottom: 0.85rem;
      line-height: 1.75;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .markdown-body ul, .markdown-body ol { margin-left: 1.25rem; margin-bottom: 1rem; list-style-type: disc; }
    .markdown-body ol { list-style-type: decimal; }
    .markdown-body li { margin-bottom: 0.35rem; }

    /* 行内代码：允许在任意位置强制折行，防止颜色代码/配置字符串撑破屏幕 */
    .markdown-body code:not(pre code) {
      background-color: rgba(148, 163, 184, 0.18);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      font-size: 0.85em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-wrap: anywhere;
    }

    /* 代码块：限制在容器内部横向滑动，不外溢 */
    .markdown-body pre {
      position: relative;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      padding: 1rem;
      border-radius: 0.6rem;
      margin-bottom: 1.25rem;
      overflow-x: auto;
      background: #0f172a;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
    }

    .markdown-body pre code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre;
      word-break: normal;
    }

    /* 表格：允许在自身区域内滚动 */
    .markdown-body table {
      display: block;
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
    }
    .markdown-body th, .markdown-body td { border: 1px solid #e2e8f0; padding: 0.5rem 0.75rem; text-align: left; }
    .dark .markdown-body th, .dark .markdown-body td { border-color: #334155; }
    .markdown-body th { background-color: #f8fafc; font-weight: 600; }
    .dark .markdown-body th { background-color: #1e293b; }
    
    .markdown-body blockquote:not(.callout-box) { border-left: 4px solid #94a3b8; padding-left: 0.85rem; margin: 1rem 0; color: #64748b; }
    .dark .markdown-body blockquote:not(.callout-box) { color: #94a3b8; }

    .markdown-body a { color: #0284c7; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; word-break: break-all; }
    .dark .markdown-body a { color: #38bdf8; }

    .markdown-body img { max-width: 100%; height: auto; display: block; }

    /* Callout 语义卡片 */
    .callout-box { margin: 1.25rem 0; padding: 0.85rem 1rem; border-radius: 0.5rem; border-left-width: 4px; font-size: 0.9rem; line-height: 1.65; max-width: 100%; overflow-wrap: anywhere; }
    .callout-box .callout-header { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; margin-bottom: 0.4rem; }
    .callout-box .callout-content p:last-child { margin-bottom: 0; }

    .callout-tip { background-color: #f0fdf4; border-color: #22c55e; color: #166534; }
    .dark .callout-tip { background-color: rgba(34, 197, 94, 0.1); border-color: #22c55e; color: #86efac; }
    .callout-note { background-color: #f0f9ff; border-color: #0284c7; color: #075985; }
    .dark .callout-note { background-color: rgba(14, 165, 233, 0.1); border-color: #38bdf8; color: #7dd3fc; }
    .callout-warning { background-color: #fffbeb; border-color: #f59e0b; color: #92400e; }
    .dark .callout-warning { background-color: rgba(245, 158, 11, 0.1); border-color: #f59e0b; color: #fde68a; }
    .callout-caution { background-color: #fef2f2; border-color: #ef4444; color: #991b1b; }
    .dark .callout-caution { background-color: rgba(239, 68, 68, 0.1); border-color: #ef4444; color: #fca5a5; }
    .callout-important { background-color: #faf5ff; border-color: #a855f7; color: #6b21a8; }
    .dark .callout-important { background-color: rgba(168, 85, 247, 0.1); border-color: #c084fc; color: #e9d5ff; }

    /* 搜索命中高亮样式 */
    mark.search-highlight {
      background-color: rgba(253, 224, 71, 0.45);
      color: inherit;
      padding: 0.1em 0.25em;
      border-radius: 3px;
    }
    .dark mark.search-highlight {
      background-color: rgba(234, 179, 8, 0.35);
      color: #fef08a;
    }

    @keyframes pulse-focus {
      0% { background-color: rgba(14, 165, 233, 0.25); border-radius: 6px; }
      100% { background-color: transparent; }
    }
    .target-highlight {
      animation: pulse-focus 2.2s cubic-bezier(0, 0, 0.2, 1);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 弹窗打开时锁定背景滚动 */
    body.search-open {
      overflow: hidden;
    }

    #search-modal {
      padding-top: max(2.5rem, env(safe-area-inset-top));
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-left: max(0.75rem, env(safe-area-inset-left));
      padding-right: max(0.75rem, env(safe-area-inset-right));
    }

    #search-modal > div {
      max-height: min(80dvh, 720px);
    }

    .search-item {
      touch-action: manipulation;
    }

    /* 窄屏边栏不可见状态优化，防止 iOS Safari 测量出幽灵宽度 */
    @media (max-width: 767px) {
      #sidebar.-translate-x-full {
        visibility: hidden;
        pointer-events: none;
      }
      #content-container {
        padding-left: 0.5rem;
        padding-right: 0.5rem;
        padding-top: 0.75rem;
        padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
      }
      #doc-content {
        padding-left: 0.85rem !important;
        padding-right: 0.85rem !important;
        padding-top: 1rem !important;
        padding-bottom: 1.5rem !important;
        border-radius: 0.5rem !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <script>
    (() => {
      'use strict';

      const $ = (id) => document.getElementById(id);
      const html = document.documentElement;
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      /* ---------- 主题管理 ---------- */
      const themeToggleBtn = $('theme-toggle');
      const themeIcon = $('theme-icon');

      function applyTheme(dark, persist = true) {
        html.classList.toggle('dark', dark);
        if (persist) localStorage.setItem('theme', dark ? 'dark' : 'light');

        if (themeIcon) {
          themeIcon.setAttribute('data-lucide', dark ? 'sun' : 'moon');
          if (window.lucide) lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
        }
      }

      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(savedTheme ? savedTheme === 'dark' : prefersDark, false);

      themeToggleBtn?.addEventListener('click', () => {
        applyTheme(!html.classList.contains('dark'));
      });

      /* ---------- 移动端侧边栏切换 ---------- */
      const menuBtn = $('menu-btn');
      const sidebar = $('sidebar');
      const closeSidebarBtn = $('close-sidebar-btn');
      const sidebarBackdrop = $('sidebar-backdrop');

      function openSidebar() {
        sidebar?.classList.remove('-translate-x-full', 'invisible');
        sidebarBackdrop?.classList.remove('hidden');
        document.body.classList.add('overflow-hidden');
      }

      function closeSidebar() {
        sidebar?.classList.add('-translate-x-full');
        sidebarBackdrop?.classList.add('hidden');
        document.body.classList.remove('overflow-hidden');
        setTimeout(() => {
          if (sidebar?.classList.contains('-translate-x-full')) {
            sidebar.classList.add('invisible');
          }
        }, 200);
      }

      menuBtn?.addEventListener('click', openSidebar);
      closeSidebarBtn?.addEventListener('click', closeSidebar);
      sidebarBackdrop?.addEventListener('click', closeSidebar);

      /* ---------- Markdown 配置 ---------- */
      marked.setOptions({
        gfm: true,
        breaks: false,
        headerIds: false,
        mangle: false
      });

      function highlightCodeBlocks(root) {
        root.querySelectorAll('pre code').forEach(code => {
          try {
            if (window.hljs) hljs.highlightElement(code);
          } catch (err) {
            console.warn('代码高亮失败:', err);
          }
        });
      }

      function escapeHtml(value = '') {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function preprocessMarkdown(md) {
        if (!md) return '';

        let cleaned = String(md).replace(/\r\n?/g, '\n');

        cleaned = cleaned.replace(
          /^(#{1,6}\s+)(.*?)$/gm,
          (match, hashes, titleContent) => {
            const textOnly = titleContent.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
            return hashes + textOnly;
          }
        );

        const lines = cleaned.split('\n');
        const titleIndex = lines.findIndex(line =>
          /^#{1,6}\s+.*Shadowrocket\s*配色与配置/i.test(line.trim())
        );
        if (titleIndex >= 0) {
          cleaned = lines.slice(titleIndex).join('\n');
        }

        cleaned = cleaned.replace(
          /(?:^|\n)#{1,6}\s*(?:使用目录|目录|Table of Contents)\s*\n[\s\S]*?(?=\n#{1,6}\s+|$)/i,
          '\n'
        );

        const calloutConfig = {
          TIP:       { label: '提示', icon: 'lightbulb', className: 'callout-tip' },
          NOTE:      { label: '注意', icon: 'info', className: 'callout-note' },
          WARNING:   { label: '警告', icon: 'alert-triangle', className: 'callout-warning' },
          CAUTION:   { label: '小心', icon: 'alert-octagon', className: 'callout-caution' },
          IMPORTANT: { label: '重要', icon: 'alert-circle', className: 'callout-important' }
        };

        cleaned = cleaned.replace(
          /(?:^|\n)(> *\[!(TIP|NOTE|WARNING|CAUTION|IMPORTANT)\][\s\S]*?)(?=\n\n(?![> ])|\n(?=[^> ])|$)/gi,
          (match, block, type) => {
            const conf = calloutConfig[type.toUpperCase()] || calloutConfig.NOTE;
            const contentLines = block.trim().split('\n');
            const content = contentLines.slice(1)
              .map(line => line.replace(/^>\s?/, ''))
              .join('\n')
              .trim();

            const innerHtml = marked.parse(content);

            return `
<div class="callout-box ${conf.className}">
  <div class="callout-header">
    <i data-lucide="${conf.icon}" class="w-4 h-4" aria-hidden="true"></i>
    <span>${conf.label}</span>
  </div>
  <div class="callout-content">${innerHtml}</div>
</div>
`;
          }
        );

        return cleaned.trim();
      }

      function slugify(text) {
        return String(text || '')
          .trim()
          .toLowerCase()
          .replace(/[\s\t\n]+/g, '-')
          .replace(/[^\w\u4e00-\u9fa5\-_]/g, '');
      }

      function makeUniqueId(base, used) {
        const safeBase = slugify(base) || 'section';
        let id = safeBase;
        let n = 2;
        while (used.has(id) || $(id)) id = `${safeBase}-${n++}`;
        used.add(id);
        return id;
      }

      /* ---------- 全文检索模块 ---------- */
      let searchIndex = [];

      function buildSearchIndex() {
        searchIndex = [];
        const docContent = $('doc-content');
        if (!docContent) return;

        let currentSection = '概述';
        let currentSectionId = '';

        Array.from(docContent.children).forEach((el, index) => {
          const tag = el.tagName.toLowerCase();

          if (['h1', 'h2', 'h3'].includes(tag)) {
            currentSection = el.innerText.trim();
            currentSectionId = el.id;
            if (currentSection) {
              searchIndex.push({
                type: 'heading',
                section: currentSection,
                elementId: currentSectionId,
                text: currentSection,
                rawElement: el
              });
            }
            return;
          }

          const text = (el.innerText || '').replace(/\s+/g, ' ').trim();
          if (text.length > 2) {
            if (!el.id) el.id = `block-${index}`;

            searchIndex.push({
              type: 'content',
              section: currentSection,
              sectionId: currentSectionId,
              elementId: el.id,
              text,
              rawElement: el
            });
          }
        });
      }

      /* ---------- 目录生成与代码复制 ---------- */
      function buildTOCAndCodeActions() {
        const docContent = $('doc-content');
        const tocTree = $('toc-tree');
        if (!docContent || !tocTree) return;

        tocTree.replaceChildren();
        const usedIds = new Set();

        Array.from(docContent.querySelectorAll('h1, h2, h3')).forEach((heading, idx) => {
          const text = heading.innerText.trim();
          if (['使用目录', '目录'].includes(text) || text.toLowerCase() === 'table of contents') {
            heading.remove();
            return;
          }

          const id = makeUniqueId(text || `section-${idx}`, usedIds);
          heading.id = id;
          heading.dataset.rawTitle = text;

          const link = document.createElement('a');
          link.href = `#${encodeURIComponent(id)}`;
          link.className =
            'block py-1.5 px-2 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 ' +
            'transition-colors truncate ' +
            (heading.tagName === 'H1'
              ? 'font-semibold text-slate-800 dark:text-slate-200'
              : heading.tagName === 'H2'
                ? 'ml-3 text-slate-600 dark:text-slate-400'
                : 'ml-6 text-xs text-slate-500 dark:text-slate-500');

          link.textContent = text;
          link.addEventListener('click', e => {
            e.preventDefault();
            scrollToElement(heading, true);
            if (window.innerWidth < 768) closeSidebar();
          });

          tocTree.appendChild(link);
        });

        buildSearchIndex();

        docContent.querySelectorAll('pre').forEach(pre => {
          if (pre.querySelector('.code-copy-btn')) return;

          const copyBtn = document.createElement('button');
          copyBtn.type = 'button';
          copyBtn.className =
            'code-copy-btn absolute top-2.5 right-2.5 text-xs bg-slate-800 ' +
            'hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded transition ' +
            'border border-slate-700 select-none';
          copyBtn.textContent = '复制';
          copyBtn.setAttribute('aria-label', '复制代码');

          copyBtn.addEventListener('click', async () => {
            const code = pre.querySelector('code')?.innerText || '';
            try {
              await navigator.clipboard.writeText(code);
              copyBtn.textContent = '已复制';
            } catch {
              const ta = document.createElement('textarea');
              ta.value = code;
              ta.style.position = 'fixed';
              ta.style.opacity = '0';
              document.body.appendChild(ta);
              ta.select();
              try {
                document.execCommand('copy');
                copyBtn.textContent = '已复制';
              } catch {
                copyBtn.textContent = '复制失败';
              }
              ta.remove();
            }
            setTimeout(() => { copyBtn.textContent = '复制'; }, 1800);
          });

          pre.appendChild(copyBtn);
        });
      }

      /* ---------- 滚动定位 ---------- */
      function scrollToElement(target, highlight = false) {
        if (!target) return;

        const container = $('content-container');
        const reduced = prefersReducedMotion.matches;

        if (container) {
          const cRect = container.getBoundingClientRect();
          const tRect = target.getBoundingClientRect();
          const targetTop = container.scrollTop + (tRect.top - cRect.top) - 16;

          container.scrollTo({
            top: Math.max(0, targetTop),
            behavior: reduced ? 'auto' : 'smooth'
          });
        } else {
          target.scrollIntoView({
            behavior: reduced ? 'auto' : 'smooth',
            block: 'start'
          });
        }

        if (highlight) {
          target.classList.remove('target-highlight');
          requestAnimationFrame(() => {
            void target.offsetWidth;
            target.classList.add('target-highlight');
          });
        }
      }

      /* ---------- 正文内部锚点跳转 ---------- */
      function setupInternalLinks() {
        const container = $('content-container');
        if (!container) return;

        container.querySelectorAll('a[href^="#"]').forEach(link => {
          if (link.dataset.internalBound === '1') return;
          link.dataset.internalBound = '1';

          link.addEventListener('click', e => {
            const href = link.getAttribute('href');
            if (!href || href === '#') return;

            let key;
            try {
              key = decodeURIComponent(href.slice(1)).trim();
            } catch {
              key = href.slice(1).trim();
            }

            if (!key) return;

            const target =
              $(key) ||
              $(slugify(key)) ||
              Array.from(container.querySelectorAll('h1,h2,h3,h4,h5,h6'))
                .find(h => h.innerText.trim() === key || h.dataset.rawTitle === key);

            if (!target) return;

            e.preventDefault();
            scrollToElement(target, true);

            try {
              history.replaceState(null, '', `#${encodeURIComponent(target.id)}`);
            } catch {}
          });
        });
      }

      /* ---------- 搜索弹窗逻辑 ---------- */
      const searchModal = $('search-modal');
      const globalSearchInput = $('global-search-input');
      const searchResults = $('search-results');
      const openSearchBtn = $('open-search-modal');
      const openSearchBtnMobile = $('open-search-modal-mobile');
      const closeSearchBtn = $('close-search-btn');

      let previousFocus = null;

      function emptySearchState() {
        searchResults.innerHTML = `
          <div class="text-center py-12 text-slate-400">
            <i data-lucide="file-text" class="w-8 h-8 mx-auto mb-2 opacity-50" aria-hidden="true"></i>
            <p>输入关键词，在章节、段落、配置参数或代码块中匹配全文</p>
          </div>
        `;
        lucide.createIcons();
      }

      function openSearch() {
        if (!searchModal || !globalSearchInput) return;

        previousFocus = document.activeElement;
        searchModal.classList.remove('hidden');
        document.body.classList.add('search-open');

        globalSearchInput.value = '';
        emptySearchState();

        requestAnimationFrame(() => {
          globalSearchInput.focus({ preventScroll: true });
        });
      }

      function closeSearch() {
        if (!searchModal) return;

        searchModal.classList.add('hidden');
        document.body.classList.remove('search-open');

        if (previousFocus && typeof previousFocus.focus === 'function') {
          try { previousFocus.focus({ preventScroll: true }); } catch {}
        }
        previousFocus = null;
      }

      openSearchBtn?.addEventListener('click', openSearch);
      openSearchBtnMobile?.addEventListener('click', openSearch);
      closeSearchBtn?.addEventListener('click', closeSearch);

      searchModal?.addEventListener('click', e => {
        if (e.target === searchModal) closeSearch();
      });

      function renderSearchResults(keyword) {
        const key = keyword.toLowerCase();
        const results = [];

        searchIndex.forEach(item => {
          const textLower = item.text.toLowerCase();
          const index = textLower.indexOf(key);
          if (index < 0) return;

          const start = Math.max(0, index - 40);
          const end = Math.min(item.text.length, index + keyword.length + 60);

          let snippet = item.text.slice(start, end);
          if (start > 0) snippet = '…' + snippet;
          if (end < item.text.length) snippet += '…';

          results.push({
            ...item,
            snippet,
            isHeadingMatch: item.type === 'heading'
          });
        });

        results.sort((a, b) => Number(b.isHeadingMatch) - Number(a.isHeadingMatch));

        if (!results.length) {
          searchResults.innerHTML = `
            <div class="text-center py-12 text-slate-400">
              <p class="font-medium">未找到包含“${escapeHtml(keyword)}”的内容</p>
              <p class="text-xs mt-1">请尝试更换缩写、协议名称或参数关键字</p>
            </div>
          `;
          return;
        }

        const escapedKeyword = escapeHtml(keyword);
        const regex = new RegExp(`(${escapedKeyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');

        searchResults.innerHTML = results.map(res => {
          const title = escapeHtml(res.section).replace(regex, '<mark class="search-highlight">$1</mark>');
          const snippet = escapeHtml(res.snippet).replace(regex, '<mark class="search-highlight">$1</mark>');

          return `
            <button
              type="button"
              class="search-item w-full text-left p-3 rounded-lg hover:bg-slate-100
                     dark:hover:bg-slate-800/70 cursor-pointer border border-transparent
                     hover:border-slate-200 dark:hover:border-slate-700 transition"
              data-target="${escapeHtml(res.elementId)}"
            >
              <span class="flex items-center gap-1.5 text-xs text-sky-600 dark:text-sky-400 font-medium mb-1">
                <i data-lucide="${res.type === 'heading' ? 'hash' : 'align-left'}" class="w-3.5 h-3.5" aria-hidden="true"></i>
                <span class="truncate">${title}</span>
              </span>
              <span class="block text-xs text-slate-600 dark:text-slate-300 line-clamp-2 leading-relaxed font-mono">
                ${snippet}
              </span>
            </button>
          `;
        }).join('');

        lucide.createIcons();

        searchResults.querySelectorAll('.search-item').forEach(item => {
          item.addEventListener('click', () => {
            const target = $(item.dataset.target);
            if (!target) return;

            closeSearch();
            if (window.innerWidth < 768) closeSidebar();
            scrollToElement(target, true);

            try {
              history.replaceState(null, '', `#${encodeURIComponent(target.id)}`);
            } catch {}
          });
        });
      }

      let searchTimer = 0;
      globalSearchInput?.addEventListener('input', e => {
        const keyword = e.target.value.trim();
        cancelAnimationFrame(searchTimer);
        searchTimer = requestAnimationFrame(() => {
          if (!keyword) emptySearchState();
          else renderSearchResults(keyword);
        });
      });

      /* ---------- 键盘快捷键 ---------- */
      window.addEventListener('keydown', e => {
        const active = document.activeElement;
        const tag = active?.tagName?.toLowerCase() || '';
        const inputActive = tag === 'input' || tag === 'textarea' || active?.isContentEditable;

        if (e.key === '/' && !inputActive && searchModal?.classList.contains('hidden')) {
          e.preventDefault();
          openSearch();
          return;
        }

        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          if (searchModal?.classList.contains('hidden')) openSearch();
          else closeSearch();
          return;
        }

        if (e.key === 'Escape') {
          if (searchModal && !searchModal.classList.contains('hidden')) {
            e.preventDefault();
            closeSearch();
          } else if (window.innerWidth < 768 && sidebar && !sidebar.classList.contains('-translate-x-full')) {
            closeSidebar();
          }
        }
      });

      /* ---------- 加载与渲染文档 ---------- */
      const MD_URL = 'https://raw.githubusercontent.com/LOWERTOP/Shadowrocket-First/README/README.md';

      async function loadManualDirectly() {
        const docContent = $('doc-content');
        if (!docContent) return;

        try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 15000);

          const res = await fetch(MD_URL, {
            cache: 'no-cache',
            signal: controller.signal,
            headers: { 'Accept': 'text/plain, text/markdown, */*' }
          });

          clearTimeout(timeout);

          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const mdText = await res.text();
          if (!mdText.trim()) throw new Error('README 内容为空');

          const processed = preprocessMarkdown(mdText);
          docContent.innerHTML = marked.parse(processed);

          highlightCodeBlocks(docContent);
          buildTOCAndCodeActions();
          setupInternalLinks();

          lucide.createIcons();

          const hash = decodeURIComponent(location.hash.slice(1));
          if (hash) {
            const target = $(hash) || $(slugify(hash));
            if (target) {
              setTimeout(() => scrollToElement(target, false), 50);
            }
          }
        } catch (err) {
          console.error('加载 README 失败:', err);

          const message = err?.name === 'AbortError'
            ? 'README.md 加载超时，请检查网络连接。'
            : '请确保网络通畅，或本地同级目录下存在 README.md 文件。';

          docContent.innerHTML = `
            <div class="text-center py-16 text-rose-500">
              <i data-lucide="wifi-off" class="w-8 h-8 mx-auto mb-3 opacity-70" aria-hidden="true"></i>
              <p class="font-semibold mb-2">获取 README.md 失败</p>
              <p class="text-sm text-slate-400">${escapeHtml(message)}</p>
              <button id="retry-load" type="button"
                class="mt-5 px-3 py-1.5 rounded-lg text-sm bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700">
                重新加载
              </button>
            </div>
          `;
          lucide.createIcons();
          $('retry-load')?.addEventListener('click', loadManualDirectly);
        }
      }

      /* ---------- 响应式视口监听 ---------- */
      function syncSidebarState() {
        if (window.innerWidth < 768) {
          sidebar?.classList.add('-translate-x-full', 'invisible');
          sidebarBackdrop?.classList.add('hidden');
          document.body.classList.remove('overflow-hidden');
        } else {
          sidebar?.classList.remove('-translate-x-full', 'invisible');
          sidebarBackdrop?.classList.add('hidden');
          document.body.classList.remove('overflow-hidden');
        }
      }

      window.addEventListener('resize', syncSidebarState, { passive: true });

      lucide.createIcons();
      syncSidebarState();
      loadManualDirectly();
    })();
  </script>
</body>
</html>
