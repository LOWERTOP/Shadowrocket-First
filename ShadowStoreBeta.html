<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f0f2f5">
    
    <title>ShadowStore</title>

    <script>
        (function() {
            let theme = "light";
            try {
                const saved = localStorage.getItem("sr_theme_override");
                const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                theme = (saved === "dark" || saved === "light") ? saved : (prefersDark ? "dark" : "light");
            } catch (e) {
                const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
                theme = prefersDark ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-theme", theme);
            const themeColor = theme === 'dark' ? '#14161a' : '#f0f2f5';
            const themeMeta = document.querySelector('meta[name="theme-color"]');
            if (themeMeta) {
                themeMeta.setAttribute('content', themeColor);
            }
            document.documentElement.style.backgroundColor = themeColor;

            try {
                const savedLang = localStorage.getItem("sr_lang_override");
                let lang = "zh";
                if (savedLang === "en" || savedLang === "zh") {
                    lang = savedLang;
                } else {
                    const primary = (navigator.languages && navigator.languages.length 
                        ? navigator.languages[0] 
                        : (navigator.language || navigator.userLanguage || "")).toLowerCase();
                    lang = primary.startsWith("zh") ? "zh" : "en";
                }
                document.documentElement.setAttribute("lang", lang === "zh" ? "zh-CN" : "en");
            } catch (e) {}

            const isMobileDevice = ('ontouchstart' in window) || 
                                   (navigator.maxTouchPoints > 0) || 
                                   (window.matchMedia && window.matchMedia('(hover: none), (pointer: coarse)').matches);
            if (isMobileDevice) {
                document.documentElement.classList.add('is-mobile');
            }

            if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
                document.documentElement.classList.add('is-pwa');
            }
        })();
    </script>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><linearGradient id=%22g%22 x1=%220%25%22 y1=%220%25%22 x2=%22100%25%22 y2=%22100%25%22><stop offset=%220%25%22 stop-color=%22%2306b6d4%22/><stop offset=%2250%25%22 stop-color=%22%233b82f6%22/><stop offset=%22100%25%22 stop-color=%22%238b5cf6%22/></linearGradient></defs><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22url(%23g)%22 stroke=%22rgba(255,255,255,0.6)%22 stroke-width=%224%22/><text x=%2250%22 y=%2255%22 font-size=%2248%22 text-anchor=%22middle%22 dominant-baseline=%22central%22>🚀</text></svg>">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/LOWERTOP/Shadowrocket-First/main/img/Shadowrocket.png">

    <style>
        /* =========================================================
            1. 全局设计令牌与统一阴影体系
        ========================================================= */
        :root, [data-theme="light"] {
            --layout-gap: 44px;
            --bg-page-solid: #f0f2f5;

            --text-primary: #4a4f59;
            --text-secondary: #7e8596;
            --text-tertiary: #a1a9ba;

            --primary: #0891b2; 
            --primary-hover: #0e7490;
            --primary-soft: rgba(6, 182, 212, 0.15);

            --primary-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
            --primary-gradient-hover: linear-gradient(135deg, #0891b2 0%, #2563eb 50%, #7c3aed 100%);
            --primary-gradient-shadow: 0 4px 14px rgba(59, 130, 246, 0.16);
            
            --bg-surface: #e6eaf0;
            --border-subtle: #d6dbe3;

            --accent-mint: #8eaeb8;  
            --accent-mint-soft: rgba(142, 174, 184, 0.2);
            --accent-orange: #c4af9d; 
            --accent-orange-soft: rgba(196, 175, 157, 0.2);

            --radius-card: 32px;
            --radius-pill: 9999px;
            --card-width: 380px;

            /* 统一立体外阴影令牌 */
            --liquid-outer-shadow: 
                0 8px 24px -4px rgba(0, 0, 0, 0.12),
                0 2px 8px -1px rgba(0, 0, 0, 0.06);
            --liquid-outer-shadow-hover: 
                0 12px 30px -4px rgba(0, 0, 0, 0.16),
                0 4px 12px -2px rgba(0, 0, 0, 0.08);

            /* 液体玻璃默认参数 */
            --border-radius: 22px;
            --liquid-cover-bg: rgba(255, 255, 255, 0.40);
            --liquid-sharp-shadow: inset 1px 1px 0px 0px rgba(255, 255, 255, 0.7), inset -1px -1px 0px 0px rgba(255, 255, 255, 0.55);
            --liquid-reflect-shadow: inset 2px 2px 7px 1.5px rgba(255, 255, 255, 0.38), inset -2px -2px 6px 1px rgba(0, 0, 0, 0.04);

            --bottom-offset: max(16px, calc(env(safe-area-inset-bottom) - 14px));
            --safe-pad-bottom: max(104px, calc(env(safe-area-inset-bottom) + 70px));
            --toast-bottom: max(93px, calc(env(safe-area-inset-bottom) + 59px));
        }

        [data-theme="dark"] {
            --bg-page-solid: #14161a;

            --text-primary: #dce1e8;
            --text-secondary: #939aa8;
            --text-tertiary: #6b7280;

            --primary: #0891b2;
            --primary-hover: #06b6d4;
            --primary-soft: rgba(6, 182, 212, 0.2);

            --primary-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
            --primary-gradient-hover: linear-gradient(135deg, #22d3ee 0%, #60a5fa 50%, #a78bfa 100%);
            --primary-gradient-shadow: 0 4px 16px rgba(59, 130, 246, 0.22);

            --bg-surface: #1d2026;
            --border-subtle: #2b3038;

            --accent-mint: #8bb7c4;
            --accent-mint-soft: rgba(139, 183, 196, 0.2);
            --accent-orange: #c4a991;
            --accent-orange-soft: rgba(196, 169, 145, 0.2);

            --liquid-outer-shadow: 
                0 10px 28px -4px rgba(0, 0, 0, 0.55),
                0 3px 10px -2px rgba(0, 0, 0, 0.40);
            --liquid-outer-shadow-hover: 
                0 16px 36px -4px rgba(0, 0, 0, 0.70),
                0 6px 14px -2px rgba(0, 0, 0, 0.50);

            --liquid-cover-bg: rgba(26, 29, 35, 0.68);
            --liquid-sharp-shadow: inset 1px 1px 0px 0px rgba(255, 255, 255, 0.2), inset -1px -1px 0px 0px rgba(0, 0, 0, 0.65);
            --liquid-reflect-shadow: inset 2px 2px 7px 1.5px rgba(255, 255, 255, 0.1), inset -2px -2px 6px 1px rgba(0, 0, 0, 0.45);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        p { margin: 0; }
        
        html { 
            margin: 0; 
            padding: 0; 
            scrollbar-gutter: stable; 
            background-color: var(--bg-page-solid);
            min-height: 100%;
            transition: background-color 0.4s ease; 
        }

        html:not(.no-scroll) {
            overflow-y: scroll;
            overscroll-behavior-y: auto;
            -webkit-overscroll-behavior-y: auto;
        }

        html.no-scroll {
            overflow-y: hidden;
            overscroll-behavior-y: none;
            -webkit-overscroll-behavior-y: none;
            touch-action: pan-x pinch-zoom;
        }
        
        body { 
            margin: 0; 
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-right: 16px;
            padding-bottom: var(--safe-pad-bottom);
            padding-left: 16px;
            background-color: transparent;
            color: var(--text-primary); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif; 
            -webkit-font-smoothing: antialiased; 
            text-rendering: optimizeLegibility; 
            transition: color 0.4s ease; 
        }

        button, input { font: inherit; }
        a { color: inherit; text-decoration: none; }
        
        .container { 
            width: 100%; 
            max-width: clamp(1080px, 95vw, 2560px); 
            margin: 0 auto; 
            position: relative; 
            top: 0; 
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* =========================================================
            2. Liquid Glass 图层系统 (6px 适度折射边)
        ========================================================= */
        .liquid_glass-wrapper {
            position: relative;
            display: flex;
            overflow: hidden;
            border-radius: var(--border-radius);
            box-shadow: var(--liquid-outer-shadow) !important;
            transition: box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .liquid_glass-outer {
            backdrop-filter: url(#liquid_glass_filter);
            -webkit-backdrop-filter: url(#liquid_glass_filter);
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: var(--border-radius);
            mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect x="0" y="0" width="100%" height="100%" rx="0" ry="0" fill="white"/></svg>'),
                        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect x="6" y="6" width="calc(100% - 12px)" height="calc(100% - 12px)" rx="18" ry="18" fill="white"/></svg>');
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect x="0" y="0" width="100%" height="100%" rx="0" ry="0" fill="white"/></svg>'),
                                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect x="6" y="6" width="calc(100% - 12px)" height="calc(100% - 12px)" rx="18" ry="18" fill="white"/></svg>');
            mask-composite: exclude;
            -webkit-mask-composite: destination-out;
            pointer-events: none;
        }

        .theme-toggle .liquid_glass-outer,
        .back-to-top-btn .liquid_glass-outer,
        .search-back-to-top-btn .liquid_glass-outer {
            mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><circle cx="50%" cy="50%" r="50%" fill="white"/></svg>'),
                        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><circle cx="50%" cy="50%" r="calc(50% - 4.5px)" fill="white"/></svg>');
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><circle cx="50%" cy="50%" r="50%" fill="white"/></svg>'),
                                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><circle cx="50%" cy="50%" r="calc(50% - 4.5px)" fill="white"/></svg>');
        }

        .liquid_glass-cover {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: absolute;
            inset: 0;
            z-index: 1;
            border-radius: var(--border-radius);
            background: var(--liquid-cover-bg);
            pointer-events: none;
        }

        .liquid_glass-reflect {
            position: absolute;
            inset: 1px;
            z-index: 2;
            box-shadow: var(--liquid-reflect-shadow);
            border-radius: var(--border-radius);
            pointer-events: none;
        }

        .liquid_glass-sharp {
            position: absolute;
            inset: 0;
            z-index: 3;
            box-shadow: var(--liquid-sharp-shadow);
            border-radius: var(--border-radius);
            pointer-events: none;
        }

        .liquid-content-layer {
            position: relative;
            z-index: 4;
            width: 100%;
        }

        /* 下拉刷新指示器 */
        .pull-refresh-indicator {
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            left: 50%;
            transform: translate3d(-50%, -60px, 0);
            z-index: 999999;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 34px;
            padding: 0 16px;
            border-radius: var(--radius-pill);
            color: var(--text-secondary);
            font-size: 12.5px;
            font-weight: 400;
            pointer-events: none;
            opacity: 0;
            will-change: transform, opacity;
            --border-radius: var(--radius-pill);
        }
        .ptr-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            color: var(--primary);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ptr-icon svg { width: 100%; height: 100%; }
        .ptr-icon.rotate { transform: rotate(180deg); }

        /* 页头设计 */
        .header { padding: 24px 0 18px; }
        .header-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .brand-wrapper { display: flex; align-items: center; gap: 10px; }

        .title { 
            margin: 0; font-size: 26px; line-height: 1.2;
            letter-spacing: -0.6px; 
            display: inline-flex; 
            align-items: flex-start;
            gap: 2px; 
        }
        .title a { 
            display: inline-flex; 
            align-items: baseline; 
            text-decoration: none; 
            transition: opacity 0.2s ease; 
        }
        .title a:hover { opacity: 0.88; }

        .title-shadow {
            font-weight: 300;
            color: #0891b2;
            transition: color 0.4s ease;
        }

        [data-theme="dark"] .title-shadow { color: #22d3ee; }

        .title-store {
            font-weight: 750;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-left: 1px;
        }

        .tag-pill-badge {
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            height: 17px; 
            padding: 0 6px;
            border-radius: var(--radius-pill); 
            background: rgba(6, 182, 212, 0.12);
            color: #0891b2; 
            font-size: 10px; 
            font-weight: 600; 
            letter-spacing: 0.3px;
            line-height: 1;
            transform: translateY(calc(3px - 20%)); 
            user-select: none;
            -webkit-user-select: none;
            white-space: nowrap;
        }

        [data-theme="dark"] .tag-pill-badge {
            background: rgba(6, 182, 212, 0.18);
            color: #22d3ee;
        }

        .subtitle { 
            margin-top: 8px; color: var(--text-secondary); font-size: 14px; 
            line-height: 1.5; font-weight: 300; 
        }
        
        .theme-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        /* 右上角功能按钮 */
        .theme-toggle { 
            position: relative;
            display: inline-flex !important; 
            align-items: center !important; 
            justify-content: center !important; 
            width: 44px; 
            height: 44px; 
            padding: 0; 
            margin: 0; 
            border: none;
            cursor: pointer; 
            color: var(--text-secondary);
            --border-radius: 50%;
            overflow: hidden;
            vertical-align: middle;
            background: transparent;
            isolation: isolate;
        }
        .theme-toggle:hover { 
            color: var(--text-primary); 
            transform: translateY(-1px);
            box-shadow: var(--liquid-outer-shadow-hover) !important;
        }
        .theme-toggle:active { transform: scale(0.92); }

        [data-theme="dark"] .theme-toggle { color: #a6b0c2; }
        [data-theme="dark"] .theme-toggle:hover { color: #ffffff; }

        .theme-toggle .icon,
        .back-to-top-btn .icon,
        .search-back-to-top-btn .icon {
            position: relative;
            z-index: 10 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 100% !important;
            height: 100% !important;
            line-height: 0;
            pointer-events: none;
        }

        .theme-toggle svg,
        .back-to-top-btn svg,
        .search-back-to-top-btn svg { 
            display: block; 
            width: 20px; 
            height: 20px; 
            flex-shrink: 0;
            pointer-events: none; 
            stroke-width: 2; 
        }

        /* 搜索 + 分类控制栏 */
        .control-bar {
            position: sticky;
            top: max(12px, env(safe-area-inset-top, 0px));
            z-index: 999990;
            display: grid;
            grid-template-columns: var(--card-width, 380px) minmax(0, 1fr);
            gap: var(--layout-gap, 44px);
            align-items: center;
            width: 100%;
            margin-bottom: 16px;
            padding: 4px 0;
        }

        /* =========================================================
            3. 分类标签栏与渐变指示器
        ========================================================= */
        .tab-bar-wrapper {
            width: 100%;
            min-width: 0;
            height: 44px;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 999990;
            gap: 10px;
        }

        .tab-bar {
            position: relative;
            flex: 1 1 auto;
            min-width: 0;
            width: 100%;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            padding: 5px;
            --border-radius: 22px;
            overflow: hidden;
            transition: max-width 0.44s cubic-bezier(0.34, 1.32, 0.64, 1);
        }

        .tab-indicator {
            position: absolute;
            top: 5px;
            bottom: 5px;
            left: 0;
            width: 0;
            border-radius: 17px;
            background: var(--primary-gradient);
            box-shadow: var(--primary-gradient-shadow);
            pointer-events: none;
            z-index: 1;
            will-change: transform, width;
            transform: translate3d(0, 0, 0);
            transition: transform 0.44s cubic-bezier(0.34, 1.32, 0.64, 1), 
                        width 0.44s cubic-bezier(0.34, 1.32, 0.64, 1);
        }

        .control-bar.is-single-column .tab-indicator {
            border-radius: 26px;
        }

        .tab-item {
            position: relative;
            isolation: isolate;
            z-index: 2;
            flex: 1 1 0;
            min-width: 0;
            height: 34px;
            line-height: 34px;
            border: none !important;
            outline: none;
            padding: 0 8px;
            border-radius: 17px;
            font-size: 13.5px;
            font-weight: 400;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
            -webkit-user-select: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: visible;
            text-overflow: ellipsis;
            transition: color 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.15s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        .tab-item:active { transform: scale(0.92); }

        .tab-item:not(.active) {
            background: transparent !important;
            color: var(--text-secondary);
        }

        .tab-item:not(.active)::before,
        .button-secondary::before {
            content: "";
            position: absolute;
            inset: -4px -8px;
            border-radius: 9999px;
            background: radial-gradient(ellipse at center, rgba(6, 182, 212, 0.14) 0%, rgba(59, 130, 246, 0.10) 42%, rgba(139, 92, 246, 0.05) 68%, transparent 82%);
            filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: -1;
        }

        [data-theme="dark"] .tab-item:not(.active)::before,
        [data-theme="dark"] .button-secondary::before {
            background: radial-gradient(ellipse at center, rgba(34, 211, 238, 0.17) 0%, rgba(59, 130, 246, 0.13) 42%, rgba(167, 139, 250, 0.08) 68%, transparent 82%);
            filter: blur(10px);
        }

        .tab-item:not(.active):hover,
        .tab-item:not(.active):active,
        .tab-item:not(.active):focus-visible {
            color: #0891b2;
        }

        [data-theme="dark"] .tab-item:not(.active):hover,
        [data-theme="dark"] .tab-item:not(.active):active,
        [data-theme="dark"] .tab-item:not(.active):focus-visible {
            color: #22d3ee;
        }

        .tab-item:not(.active):hover::before,
        .tab-item:not(.active):active::before,
        .tab-item:not(.active):focus-visible::before {
            opacity: 1;
        }

        .tab-item.active {
            color: #FFFFFF !important;
            background: transparent !important;
            font-weight: 400 !important;
        }

        /* 默认多列宽屏模式下隐藏底部单列栏返回按钮 */
        .control-bar:not(.is-single-column) .back-to-top-btn {
            display: none !important;
        }

        /* 单列底栏模式下的返回按钮 (62px) */
        .control-bar.is-single-column .back-to-top-btn {
            position: relative;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            width: 0;
            height: 62px;
            padding: 0;
            margin: 0;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.65);
            pointer-events: none;
            overflow: hidden;
            flex-shrink: 0;
            --border-radius: 31px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            transition: width 0.44s cubic-bezier(0.34, 1.32, 0.64, 1),
                        opacity 0.3s ease,
                        transform 0.44s cubic-bezier(0.34, 1.32, 0.64, 1),
                        box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        visibility 0.44s ease;
        }

        .control-bar.is-single-column .back-to-top-btn.visible {
            width: 62px;
            opacity: 1;
            visibility: visible;
            transform: scale(1);
            pointer-events: auto;
        }

        .control-bar.is-single-column .back-to-top-btn:hover { 
            color: var(--text-primary);
            box-shadow: var(--liquid-outer-shadow-hover) !important;
        }
        .control-bar.is-single-column .back-to-top-btn:active { transform: scale(0.92); }
        [data-theme="dark"] .control-bar.is-single-column .back-to-top-btn { color: #a6b0c2; }
        [data-theme="dark"] .control-bar.is-single-column .back-to-top-btn:hover { color: #ffffff; }

        /* 宽屏搜索框区域及其专属返回按钮 (44px) */
        .search-wrapper { 
            position: relative;
            height: 44px;
            min-width: 0;
            padding: 0; 
            margin: 0; 
            background: transparent; 
            display: flex;
            align-items: center;
            width: 100%;

        /* 在单列模式下彻底禁用搜索框专属返回按钮，避免影响竖屏模式 */

        .search-box-inner {

        .search-icon {

        }
        
        .input-wrapper {
            position: relative; flex: 1; min-width: 0;

            display: block;

        .search { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;

            padding: 0; margin: 0; border: 0; outline: none; background: transparent;
            color: var(--text-primary); font-size: 15px; font-weight: 400; vertical-align: middle;
            -webkit-appearance: none; appearance: none;
            z-index: 2;
        }
        
        .search::placeholder { color: transparent; }
        .search:disabled { cursor: not-allowed; }

        .placeholder-track {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; flex-direction: column;
            transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1; pointer-events: none;

        .placeholder-item {
            height: 32px; line-height: 32px;
            color: var(--text-tertiary); font-size: 15px; font-weight: 300;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .search:focus ~ .placeholder-track,
        .search:not(:placeholder-shown) ~ .placeholder-track {
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .search:not(:focus):placeholder-shown ~ .placeholder-track {
            opacity: 1;
            transition: opacity 0.3s ease 0.1s;
        }

        .search-shortcut, .search-clear { 
            width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;

            font-size: 12px; font-weight: 600; 
            transition: color 0.2s ease, opacity 0.2s ease;

        .status-dot.error { background: #c8a3ab; box-shadow: 0 0 0 3px rgba(200, 163, 171, 0.2); }
        @keyframes statusPulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
        
        /* 列表与卡片网格 */
        .modules { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); 
            gap: var(--layout-gap, 44px);

        }
        .module-icon:active { transform: scale(0.95); }

        .card-main { min-width: 0; flex: 1; }

            line-height: 1.6; 
            font-weight: 300;

        .card-bottom {

        .button-secondary {

            isolation: isolate;
            background: transparent !important; 
            color: #0891b2; 
            border: none !important;

            color: #0891b2; 
        }
        .button-secondary:hover::before,
        .button-secondary:active::before,
        .button-secondary:focus-visible::before {
            opacity: 1;
        }
        [data-theme="dark"] .button-secondary:hover,

        .button-primary {

            font-size: 12.5px; 
            line-height: 1.6; 
            font-weight: 300; 
        }
        
        /* 浮动提示 */
        .toast { 
            position: fixed; 
            bottom: var(--toast-bottom); 
            left: 50%; 
            transform: translateX(-50%) translateY(100px); 
            z-index: 999999; 
            padding: 12px 26px; 
            --border-radius: var(--radius-pill); 
            color: var(--text-primary); 
            font-size: 13.5px; 
            font-weight: 450; 
            opacity: 0; 
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease; 
            pointer-events: none; 
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* =========================================================
            4. 单列布局与底栏完全重构规范
        ========================================================= */
        .control-bar.is-single-column {
            display: block;
            position: sticky;
            top: max(12px, env(safe-area-inset-top, 0px));
            z-index: 999990;
            width: 100%;
            margin-bottom: 16px;
            padding: 4px 0;
            pointer-events: none;
        }

        .control-bar.is-single-column .search-wrapper {
            position: relative;
            top: auto;
            width: 100%;
            height: 44px;
            padding: 0;
            margin: 0;
            z-index: 999995;
            pointer-events: none;
        }

        .control-bar.is-single-column .search-box-inner {
            pointer-events: auto;
        }

        .control-bar.is-single-column .tab-bar-wrapper {
            position: fixed;
            left: 0;
            right: 0;
            bottom: var(--bottom-offset);
            width: 100%;
            height: 62px;
            padding: 0 16px;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 999999;
            max-width: clamp(1080px, 95vw, 2560px);
            margin-left: auto;
            margin-right: auto;
        }

        .control-bar.is-single-column .tab-bar {
            pointer-events: auto;
            height: 62px;
            padding: 5px;
            --border-radius: 31px;
            gap: 4px;
            overflow: hidden;
        }

        .control-bar.is-single-column .tab-item {
            height: 100%;
            min-height: 0;
            line-height: normal;
            border-radius: 26px;
            font-size: 14.5px;
            font-weight: 400;
            padding: 0 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* 移动端与小屏幕适配 */
        @media (hover: none), (pointer: coarse), (max-width: 860px) {
            .modules { grid-template-columns: 1fr; }
            .module-card:hover { transform: none !important; }

        @media (max-width: 600px) {

            .module-card { padding: 22px; }
            .module-name { font-size: 18px; }
            .module-description { flex: none; }
            .card-bottom { margin-top: 36px; padding-top: 0; }
            .search-shortcut { display: none; }
        }

        @media (max-width: 420px) {
            .card-bottom { flex-direction: column; align-items: stretch; gap: 12px; }
            .action-buttons { width: 100%; justify-content: flex-end; }
            .control-bar.is-single-column .tab-bar { padding: 5px; gap: 2px; }
            .control-bar.is-single-column .tab-item { font-size: 13px; padding: 0 4px; border-radius: 26px; }
        }
    </style>
</head>

        function escapeHTML(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function safeURL(value, allowed = ["https:"]) {
            if (!value || typeof value !== "string") return "";
            const trimmed = value.trim();
            try {
                const parsed = new URL(trimmed, location.href);
                return allowed.includes(parsed.protocol) ? parsed.href : "";
            } catch {
                return "";
            }
        }

        function safeInstallURL(value) {
            return safeURL(value, ["shadowrocket:", "https:"]);
        }

        function normalizeStaticResources(lang = state.currentLang) {
            return STATIC_RESOURCES_DATA
                .filter(item => !item.isDubious)
                .map(item => {
                    const localized = item.i18n[lang] || item.i18n.zh;
                    const searchTokens = [
                        localized.name,
                        localized.description,
                        item.author.name,
                        item.sourceName,
                        item.category,
                        "shadowrocket", "手册", "manual", "教程", "guide", "仓库", "repo", "文档", "docs", "配置", "config"

                    return {
                        name: localized.name,
                        category: item.category || "more",
                        description: localized.description,
                        icon: item.icon,
                        author: item.author,
                        authorAvatar: item.authorAvatar,
                        sourceName: item.sourceName,

        }

        function normalizeModules(data) {
            if (!Array.isArray(data)) return [];
            return data
                .filter(item => item && typeof item === "object" && !item.isDubious)
                .map(m => {
                    const rawURL = safeURL(m.rawURL || m.url || "");
                    const authorName = m.author?.name || m.author?.username || "";
                    const authorURL = safeURL(m.author?.url || (m.author?.username ? `https://github.com/${m.author.username}` : ""));
                    const authorAvatar = safeURL(m.authorAvatar || m.author?.avatar || "");
                    const sourceName = m.sourceName || "开源仓库";
                    const sourceURL = safeURL(m.sourceURL || "");
                    
                    const customInstall = safeInstallURL(m.installURL || "");
                    const fallbackInstall = rawURL ? `shadowrocket://install?url=${encodeURIComponent(rawURL)}` : "";
                    const installURL = customInstall || fallbackInstall;
                    
                    let category = "module";
                    if (m.category) {
                        const c = String(m.category).toLowerCase();
                        if (c.includes("config") || c.includes("配置")) category = "config";
                        else if (c.includes("manual") || c.includes("手册") || c.includes("文档")) category = "manual";
                        else if (c.includes("more") || c.includes("更多") || c.includes("工具")) category = "more";
                    }

                    const searchTokens = [
                        m.name, m.description, authorName, m.author?.username, sourceName, category, m._searchKeywords
                    ].filter(Boolean).join(" ").normalize("NFKC").toLowerCase();

                    return {
                        name: m.name || "未命名模块",
                        category: category,
                        description: m.description || "",
                        icon: safeURL(m.icon || ""),
                        author: { name: authorName, url: authorURL, username: m.author?.username || "" },

                        primaryBtnText: m.primaryBtnText || "",
                        _searchText: searchTokens,
                        _domElement: null
                    };
                });
        }

        async function copyToClipboard(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {}
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            let success = false;
            try { success = document.execCommand("copy"); } catch (e) {}
            document.body.removeChild(textArea);
            return success;
        }

                const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--layout-gap")) || 44;
                const totalGap = (cols - 1) * gap;
                newWidth = Math.max(0, (modulesContainer.offsetWidth - totalGap) / cols);
            }
            if (newWidth > 0 && Math.abs(newWidth - lastCardWidthVal) > 1) {
                lastCardWidthVal = newWidth;
                document.documentElement.style.setProperty('--card-width', `${newWidth}px`);
            }
        }

        let resizeDebounceTimer = null;
        window.addEventListener("resize", () => {
            clearTimeout(resizeDebounceTimer);
            isTabAnimating = false;
            updateControlBarLayout();
            updateTabIndicator(false);
            
            resizeDebounceTimer = setTimeout(() => {
                updateCardWidth();
                updateControlBarLayout();
                updateTabIndicator(false);
                checkScrollLock();
            }, 80);
        }, { passive: true });

        if (window.ResizeObserver && tabBarEl) {

                updateTabIndicator(true);
            });

        function renderAuthor(module) {
            const author = module.author || {};
            const avatar = module.authorAvatar;
            const avatarHTML = avatar ? `<img class="author-avatar" src="${escapeHTML(avatar)}" decoding="async" referrerpolicy="no-referrer" alt="">` : "";
            const authorURL = author.url;
            const authorName = author.name || author.username || I18N[state.currentLang].authorUnknown;
            if (authorURL) {
                return `<a class="author" href="${escapeHTML(authorURL)}" target="_blank" rel="noopener">${avatarHTML}${escapeHTML(authorName)}</a>`;
            }
            return `<span class="author">${avatarHTML}${escapeHTML(authorName)}</span>`;
        }

        function createModuleCard(module) {
            if (module._domElement) {
                return module._domElement;
            }

            const langObj = I18N[state.currentLang];
            const card = document.createElement("article");
            card.className = "module-card liquid_glass-wrapper";

            const fallbackIcon = createIOSAppIcon(module.name);
            const icon = module.icon || fallbackIcon;
            const authorHTML = renderAuthor(module);
            const isRepo = Boolean(module.isRepoCard);

            const directOpenURL = module.rawURL || module.sourceURL || "";
            let iconHTML = "";
            if (directOpenURL) {
                iconHTML = `
                    <a class="module-icon" href="${escapeHTML(directOpenURL)}" target="_blank" rel="noopener noreferrer" title="${escapeHTML(langObj.openLinkAria || '在新窗口打开资源直链')}" aria-label="${escapeHTML(langObj.openLinkAria || '在新窗口打开资源直链')}">
                        <img src="${escapeHTML(icon)}" alt="${escapeHTML(module.name)}" decoding="async" referrerpolicy="no-referrer">
                    </a>
                `;
            } else {
                iconHTML = `
                    <div class="module-icon" style="cursor: default;">
                        <img src="${escapeHTML(icon)}" alt="${escapeHTML(module.name)}" decoding="async" referrerpolicy="no-referrer">
                    </div>
                `;
            }

            const sourceLinkHTML = module.sourceURL
                ? `<a class="source-link" href="${escapeHTML(module.sourceURL)}" target="_blank" rel="noopener" title="${escapeHTML(module.sourceName)}">${escapeHTML(module.sourceName)}</a>`
                : `<span class="source-link source-link-static">${escapeHTML(module.sourceName)}</span>`;

            let secondaryBtnHTML = "";
            if (module.preInstallURL) {
                const preText = module.secondaryBtnText || langObj.btnPreInstall;
                secondaryBtnHTML = `<a class="button button-secondary" href="${escapeHTML(module.preInstallURL)}" aria-label="${escapeHTML(preText)} ${escapeHTML(module.name)}">${escapeHTML(preText)}</a>`;
            } else if (module.rawURL) {
                secondaryBtnHTML = `<button class="button button-secondary copy-btn" data-url="${escapeHTML(module.rawURL)}" aria-label="${langObj.btnCopyLink} ${escapeHTML(module.name)}">${langObj.btnCopyLink}</button>`;
            }

            let defaultPrimaryText = langObj.btnInstallModule;
            if (module.category === "config") defaultPrimaryText = langObj.btnInstallConfig;
            else if (module.category === "manual") defaultPrimaryText = langObj.btnViewManual;
            else if (isRepo) defaultPrimaryText = langObj.btnVisitRepo;

            const primaryText = module.primaryBtnText || defaultPrimaryText;
            const primaryTarget = isRepo ? `target="_blank" rel="noopener"` : "";
            const installBtnHTML = module.installURL 
                ? `<a class="button button-primary" href="${escapeHTML(module.installURL)}" ${primaryTarget} aria-label="${escapeHTML(primaryText)} ${escapeHTML(module.name)}">${escapeHTML(primaryText)}</a>` 
                : "";

            const descriptionText = module.description ? escapeHTML(module.description) : langObj.noDesc;

            card.innerHTML = `
                <div class="liquid_glass-outer"></div>
                <div class="liquid_glass-cover"></div>
                <div class="liquid_glass-reflect"></div>
                <div class="liquid_glass-sharp"></div>
                <div class="liquid-content-layer" style="display: flex; flex-direction: column; height: 100%;">
                    <div class="card-header">
                        ${iconHTML}
                        <div class="card-main">
                            <h2 class="module-name">${escapeHTML(module.name)}</h2>
                            <div class="module-meta">
                                ${authorHTML}
                                <span class="meta-separator">/</span>
                                ${sourceLinkHTML}
                            </div>
                        </div>
                    </div>
                    <div class="module-description">${descriptionText}</div>
                    <div class="card-bottom">
                        <div class="action-buttons">
                            ${secondaryBtnHTML}
                            ${installBtnHTML}
                        </div>
                    </div>
                </div>
            `;
            
            const copyBtn = card.querySelector(".copy-btn");
            if (copyBtn) {
                copyBtn.addEventListener("click", async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const url = copyBtn.getAttribute("data-url");
                    if (!url) {
                        showToast(langObj.toastInvalidLink);
                        return;
                    }
                    const success = await copyToClipboard(url);
                    let toastMessage = langObj.toastCopiedUrl;
                    if (isRepo) toastMessage = langObj.toastCopiedRepo;
                    else if (module.category === "config") toastMessage = langObj.toastCopiedConfig;
                    else if (module.category === "manual") toastMessage = langObj.toastCopiedManual;
                    showToast(success ? toastMessage : langObj.toastCopyFailed);

            const iconImg = card.querySelector(".module-icon img");

            if (avatarImg) {
                avatarImg.addEventListener("error", () => { avatarImg.remove(); }, { once: true });

        function appendNextBatch() {
            if (state.currentlyRendered >= state.filteredModules.length) {
                sentinel.style.display = "none";
                checkScrollLock();
                return;
            }
            const fragment = document.createDocumentFragment();
            const nextBatch = state.filteredModules.slice(state.currentlyRendered, state.currentlyRendered + CONFIG.PAGE_SIZE);
            for (let i = 0; i < nextBatch.length; i++) {
                const module = nextBatch[i];
                if (module) fragment.appendChild(createModuleCard(module));
            }
            modulesContainer.appendChild(fragment);
            state.currentlyRendered += nextBatch.length;
            
            sentinel.style.display = state.currentlyRendered >= state.filteredModules.length ? "none" : "block";
            
            updateCardWidth();
            updateSearchLayer();
            checkScrollLock();
        }

        function renderFilteredList(list) {
            state.filteredModules = list;
            state.currentlyRendered = 0;
            modulesContainer.innerHTML = "";

            const langObj = I18N[state.currentLang];
            const currentLabel = langObj.countLabel[state.activeTab] || langObj.countLabel.more;

            if (!state.filteredModules.length) {
                sentinel.style.display = "none";
                modulesContainer.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div>${escapeHTML(langObj.emptyText(currentLabel))}</div>`;
                countText.textContent = langObj.countText(0, currentLabel);
                checkScrollLock();
                return;
            }

            countText.textContent = langObj.countText(state.filteredModules.length, currentLabel);
            appendNextBatch();
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !state.isDataLoading) {
                appendNextBatch();
            }
        }, { rootMargin: "300px" });
        observer.observe(sentinel);

        function filterModules() {
            const keyword = searchInput.value.trim().normalize("NFKC").toLowerCase();
            if (searchInput.value.length > 0) {
                searchClear.classList.add("visible");
                if (searchShortcut) searchShortcut.style.display = "none";
            } else {
                searchClear.classList.remove("visible");
                if (searchShortcut) searchShortcut.style.display = "";
            }

            let result = state.allModules.filter(m => (m.category || "module") === state.activeTab);
            if (keyword) {
                result = result.filter(m => m._searchText && m._searchText.includes(keyword));
            }

            renderFilteredList(result);
        }

        tabItems.forEach(tab => {
            tab.addEventListener("click", () => {
                const targetTab = tab.getAttribute("data-tab");
                if (state.activeTab === targetTab) return;

                state.activeTab = targetTab;
                tabItems.forEach(t => {
                    const isActive = t === tab;
                    t.classList.toggle("active", isActive);
                    t.setAttribute("aria-selected", isActive ? "true" : "false");
                });

                isTabAnimating = true;
                clearTimeout(tabAnimTimer);
                tabAnimTimer = setTimeout(() => { isTabAnimating = false; }, 460);

                updateTabIndicator(true);

                clearTimeout(tabSwitchContentTimer);
                tabSwitchContentTimer = setTimeout(() => {
                    filterModules();
                    if (window.scrollY > 0) {
                        window.scrollTo({ top: 0, behavior: "smooth" });
                    }
                }, 160);
            });
        });

        searchInput.addEventListener("input", () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(filterModules, 120);
        });

        searchClear.addEventListener("click", (e) => {
            e.preventDefault();
            searchInput.value = "";
            filterModules();
            if (window.innerWidth > 768) searchInput.focus();
        });

        window.addEventListener("keydown", (e) => {
            if (e.key === "/" && document.activeElement !== searchInput) {
                if (searchInput.disabled) return;
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            } else if (e.key === "Escape" && document.activeElement === searchInput) {
                searchInput.value = "";
                searchInput.blur();
                filterModules();
            }
        });

        function setSearchState(enabled) {
            searchInput.disabled = !enabled;
            const langObj = I18N[state.currentLang];
            const text = enabled ? langObj.searchPlaceholderReady : langObj.searchPlaceholderWait;
            const mainP = document.getElementById("mainPlaceholder");
            if (mainP) mainP.textContent = text;

            if (searchShortcut) {
                searchShortcut.style.opacity = enabled ? "1" : "0.35";
            }

            if (!enabled) {
                searchInput.value = "";
                searchClear.classList.remove("visible");
            }
        }

        let noticeInterval = null;
        if (noticeTrack) {
            const firstItemClone = noticeTrack.children[0].cloneNode(true);
            noticeTrack.appendChild(firstItemClone);

            let noticeIndex = 0;
            const originalCount = noticeTrack.children.length - 1; 
            let isAnimating = false;

            function updateNoticePosition() {
                noticeTrack.style.transition = 'transform 0.45s cubic-bezier(0.25, 1, 0.5, 1)';
                noticeTrack.style.transform = `translateY(-${noticeIndex * 32}px)`;
            }

            function nextNotice() {
                if (document.activeElement === searchInput || searchInput.value.length > 0) return;
                if (isAnimating) return;
                isAnimating = true;
                noticeIndex++;
                updateNoticePosition();

                if (noticeIndex === originalCount) {
                    setTimeout(() => {
                        noticeTrack.style.transition = 'none';
                        noticeIndex = 0;
                        noticeTrack.style.transform = `translateY(0)`;
                        void noticeTrack.offsetHeight;
                        isAnimating = false;
                    }, 450); 
                } else {
                    setTimeout(() => { isAnimating = false; }, 450);
                }
            }

            function startNoticeLoop() {
                if (noticeInterval) clearInterval(noticeInterval);
                noticeInterval = setInterval(nextNotice, 3800);
            }

            function stopNoticeLoop() {
                if (noticeInterval) {
                    clearInterval(noticeInterval);
                    noticeInterval = null;
                }
            }

            startNoticeLoop();
            document.addEventListener("visibilitychange", () => {
                if (document.hidden) stopNoticeLoop();
                else startNoticeLoop();
            });
        }

        const mediaQueryDark = window.matchMedia("(prefers-color-scheme: dark)");

        function getThemeMode() {
            try {
                const saved = localStorage.getItem("sr_theme_override");
                if (saved === "dark" || saved === "light" || saved === "auto") return saved;
            } catch (e) {}
            return "auto"; 
        }

        function getEffectiveTheme(mode) {
            if (mode === "dark" || mode === "light") return mode;
            if (mode === "auto") return mediaQueryDark.matches ? "dark" : "light";
            return "light";
        }

        function updateThemeUI() {
            const mode = getThemeMode();
            const currentTheme = getEffectiveTheme(mode);
            document.documentElement.setAttribute("data-theme", currentTheme);
            
            const themeColor = currentTheme === "dark" ? "#14161a" : "#f0f2f5";
            const themeColorMeta = document.querySelector('meta[name="theme-color"]');
            if (themeColorMeta) {
                themeColorMeta.setAttribute("content", themeColor);
            }
            document.documentElement.style.backgroundColor = themeColor;

            const isZh = state.currentLang === "zh";
            if (mode === "light") {
                themeIconContainer.innerHTML = SUN_ICON;
                const desc = isZh ? "当前：浅色模式（点击切换深色）" : "Current: Light mode (Click for Dark)";
                themeToggleBtn.setAttribute("title", desc);
                themeToggleBtn.setAttribute("aria-label", desc);
            } else if (mode === "dark") {
                themeIconContainer.innerHTML = MOON_ICON;
                const desc = isZh ? "当前：深色模式（点击切换自动跟随）" : "Current: Dark mode (Click for Auto)";
                themeToggleBtn.setAttribute("title", desc);
                themeToggleBtn.setAttribute("aria-label", desc);
            } else {
                themeIconContainer.innerHTML = SYSTEM_ICON;
                const desc = isZh ? "当前：自动跟随系统（点击切换反色模式）" : "Current: Auto System (Click to switch)";
                themeToggleBtn.setAttribute("title", desc);
                themeToggleBtn.setAttribute("aria-label", desc);
            }
        }

        mediaQueryDark.addEventListener("change", () => {
            if (getThemeMode() === "auto") {
                updateThemeUI();
            }
        });

        themeToggleBtn.addEventListener("click", () => {
            const currentMode = getThemeMode();
            const isSystemDark = mediaQueryDark.matches;
            let nextMode, toastText;
            const langObj = I18N[state.currentLang];

            if (currentMode === "auto") {
                if (isSystemDark) {
                    nextMode = "light";
                    toastText = langObj.themeLightToast;
                } else {
                    nextMode = "dark";
                    toastText = langObj.themeDarkToast;
                }
            } else if (currentMode === "light") {
                if (isSystemDark) {
                    nextMode = "dark";
                    toastText = langObj.themeDarkToast;
                } else {
                    nextMode = "auto";
                    toastText = langObj.themeAutoToast;
                }
            } else { 
                if (isSystemDark) {
                    nextMode = "auto";
                    toastText = langObj.themeAutoToast;
                } else {
                    nextMode = "light";
                    toastText = langObj.themeLightToast;
                }
            }

            try {
                localStorage.setItem("sr_theme_override", nextMode);
            } catch (e) {}
            updateThemeUI();
            showToast(toastText);
        });

        function updateLanguageUI() {
            const lang = state.currentLang;
            const dict = I18N[lang];

            document.documentElement.setAttribute("lang", lang === "zh" ? "zh-CN" : "en");
            tagPillBadge.textContent = dict.badgeCommunity;
            subtitleEl.textContent = dict.subtitle;
            footerText.innerHTML = dict.footer;

            if (notice2) notice2.textContent = dict.notice2;

            setSearchState(!searchInput.disabled);
            updateThemeUI();

            if (state.statusKey && dict[state.statusKey]) {
                statusText.textContent = dict[state.statusKey];
            }

            if (!state.isPullRefreshing) {
                ptrText.textContent = dict.ptrContinue;
            }

            const staticItems = normalizeStaticResources(lang);
            const dynamicItems = normalizeModules(state.rawNetworkData);
            state.allModules = [...staticItems, ...dynamicItems];

            state.allModules.forEach(m => { m._domElement = null; });
            filterModules();

            requestAnimationFrame(() => updateTabIndicator(false));
        }

        langToggleBtn.addEventListener("click", () => {
            state.currentLang = state.currentLang === "zh" ? "en" : "zh";
            try {
                localStorage.setItem("sr_lang_override", state.currentLang);
            } catch (e) {}

            updateLanguageUI();
            showToast(I18N[state.currentLang].langSwitchToast);
        });

        updateThemeUI();

        /* 下拉手势 */
        let touchStartX = 0, touchStartY = 0, isPulling = false, isPullLocked = false, pullRafId = null;
        let hasPulledContainer = false;
        const MIN_DRAG_DEADZONE = 30;
        const PULL_TRIGGER_DIFF = 150; 

        async function triggerForceReload() {
            if (state.isPullRefreshing || state.isDataLoading) return;
            state.isPullRefreshing = true;

            const langObj = I18N[state.currentLang];
            ptrIcon.classList.remove("rotate");
            ptrText.textContent = langObj.ptrRefreshing;

            const success = await loadModules(true);
            showToast(success ? langObj.toastDataRefreshed : langObj.toastSyncFailed);
            
            setTimeout(() => {
                const reboundBezier = 'top 0.38s cubic-bezier(0.2, 0.9, 0.3, 1)';
                pageContainer.style.transition = reboundBezier;
                pageContainer.style.top = '0';

                pullRefreshIndicator.style.transition = `${reboundBezier}, opacity 0.25s ease`;
                pullRefreshIndicator.style.opacity = '0';
                pullRefreshIndicator.style.transform = 'translate3d(-50%, -60px, 0)';
                ptrIcon.classList.remove("rotate");
                state.isPullRefreshing = false;
                hasPulledContainer = false;
                checkScrollLock();
            }, 500);
        }

        function resetPullState() {
            isPulling = false;
            isPullLocked = false;
            if (pullRafId) cancelAnimationFrame(pullRafId);

            if (hasPulledContainer) {
                const reboundBezier = 'top 0.38s cubic-bezier(0.2, 0.9, 0.3, 1)';
                pageContainer.style.transition = reboundBezier;
                pageContainer.style.top = '0';
                pullRefreshIndicator.style.transition = `${reboundBezier}, opacity 0.25s ease`;
                pullRefreshIndicator.style.opacity = '0';
                pullRefreshIndicator.style.transform = 'translate3d(-50%, -60px, 0)';
            } else {
                pageContainer.style.transition = 'none';
                pageContainer.style.top = '0';
                pullRefreshIndicator.style.transition = 'none';
                pullRefreshIndicator.style.opacity = '0';
            }
            
            ptrIcon.classList.remove("rotate");
            hasPulledContainer = false;
        }

        window.addEventListener('touchstart', (e) => {
            if (state.isPullRefreshing || state.isDataLoading) return;
            if (e.target.closest("input, button, a, textarea, select, label, .module-card")) return;
            const isAtTop = (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
            if (isAtTop) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                isPulling = true;
                isPullLocked = false;
                hasPulledContainer = false;
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isPulling || state.isPullRefreshing || state.isDataLoading) return;

            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            const diffX = currentX - touchStartX;
            const diffY = currentY - touchStartY;

            if (!isPullLocked) {
                if (Math.abs(diffX) > Math.abs(diffY) || diffY <= 0) {
                    isPulling = false;
                    isPullLocked = true;
                    return;
                }
                if (diffY > MIN_DRAG_DEADZONE) {
                    isPullLocked = true;
                    pageContainer.style.transition = 'none';
                    pullRefreshIndicator.style.transition = 'none';
                }
            }

            if (isPullLocked && diffY > MIN_DRAG_DEADZONE) {
                hasPulledContainer = true;
                const effectiveDiff = diffY - MIN_DRAG_DEADZONE;
                const containerShift = Math.min(Math.pow(effectiveDiff, 0.65) * 1.3, 48);
                const indicatorShift = Math.min(containerShift * 0.42, 18);
                const progress = Math.min(effectiveDiff / (PULL_TRIGGER_DIFF - MIN_DRAG_DEADZONE), 1);
                const langObj = I18N[state.currentLang];

                if (pullRafId) cancelAnimationFrame(pullRafId);
                pullRafId = requestAnimationFrame(() => {
                    pageContainer.style.top = `${containerShift}px`;
                    pullRefreshIndicator.style.opacity = Math.min(progress * 1.2, 1);
                    pullRefreshIndicator.style.transform = `translate3d(-50%, ${indicatorShift}px, 0)`;

                    if (diffY >= PULL_TRIGGER_DIFF) {
                        ptrIcon.classList.add("rotate");
                        ptrText.textContent = langObj.ptrRelease;
                    } else {
                        ptrIcon.classList.remove("rotate");
                        ptrText.textContent = langObj.ptrContinue;
                    }
                });

                if (e.cancelable) e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (!isPulling || state.isPullRefreshing || state.isDataLoading) return;
            isPulling = false;
            isPullLocked = false;
            if (pullRafId) cancelAnimationFrame(pullRafId);

            const currentY = e.changedTouches[0].clientY;
            const diffY = currentY - touchStartY;
            const isAtTop = (window.scrollY || document.documentElement.scrollTop || 0) <= 0;

            if (hasPulledContainer && diffY >= PULL_TRIGGER_DIFF && isAtTop) {
                pageContainer.style.transition = 'top 0.35s cubic-bezier(0.2, 0.9, 0.3, 1)';
                pageContainer.style.top = '38px';
                pullRefreshIndicator.style.transition = 'transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.25s ease';
                pullRefreshIndicator.style.transform = `translate3d(-50%, 16px, 0)`;
                pullRefreshIndicator.style.opacity = '1';
                triggerForceReload();
            } else {
                resetPullState();
            }
        }, { passive: true });

        window.addEventListener('touchcancel', resetPullState, { passive: true });

        function cleanOldCaches() {
            try {
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && (key.startsWith("sr_modules_data_") || key.startsWith("sr_modules_time_"))) {
                        if (key !== CONFIG.CACHE_KEY && key !== CONFIG.CACHE_TIME_KEY) {
                            keysToRemove.push(key);
                        }
                    }
                }
                keysToRemove.forEach(k => localStorage.removeItem(k));
            } catch (e) {}
        }

        async function loadModules(forceRefresh = false) {
            state.isDataLoading = true;
            let cachedData = null;
            let cachedTime = 0;
            const staticItems = normalizeStaticResources(state.currentLang);
            const langObj = I18N[state.currentLang];

            try {
                cachedData = localStorage.getItem(CONFIG.CACHE_KEY);
                cachedTime = Number(localStorage.getItem(CONFIG.CACHE_TIME_KEY) || 0);
            } catch (e) {}

            const isCacheFresh = !forceRefresh && cachedData && cachedTime && (Date.now() - cachedTime < CONFIG.CACHE_MAX_AGE);
            let hasRenderedCache = false;

            if (!forceRefresh && cachedData) {
                try {
                    const parsed = JSON.parse(cachedData);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        state.rawNetworkData = parsed;
                        const normalized = normalizeModules(parsed);
                        if (normalized.length > 0) {
                            state.allModules = [...staticItems, ...normalized];
                            filterModules();
                            setSearchState(true);
                            hasRenderedCache = true;

                            if (isCacheFresh) {
                                state.statusKey = "statusReady";
                                statusText.textContent = langObj.statusReady;
                                statusDot.className = "status-dot";
                                state.isDataLoading = false;
                                return true;
                            }

                            state.statusKey = "statusChecking";
                            statusText.textContent = langObj.statusChecking;
                            statusDot.className = "status-dot loading";
                        }
                    }
                } catch (e) {
                    hasRenderedCache = false;
                }
            }

            if (!hasRenderedCache && state.allModules.length === 0) {
                state.allModules = staticItems;
                filterModules();
                setSearchState(false);
                state.statusKey = "statusFetchingStatic";
                statusText.textContent = langObj.statusFetchingStatic;
                statusDot.className = "status-dot loading";
            }

            try {
                const fetchUrl = forceRefresh ? `${CONFIG.DATA_JSON_URL}?_t=${Date.now()}` : CONFIG.DATA_JSON_URL;
                const response = await fetch(fetchUrl, { cache: forceRefresh ? "no-store" : "default" });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                if (!Array.isArray(data) || !data.length) throw new Error("资源列表为空");

                state.rawNetworkData = data;
                const normalized = normalizeModules(data);
                if (!normalized.length) throw new Error("未解析到有效资源数据");

                state.allModules = [...staticItems, ...normalized];
                filterModules();
                setSearchState(true);

                try {
                    localStorage.setItem(CONFIG.CACHE_KEY, JSON.stringify(data));
                    localStorage.setItem(CONFIG.CACHE_TIME_KEY, String(Date.now()));
                } catch (e) {}

                state.statusKey = "statusSynced";
                statusText.textContent = langObj.statusSynced;
                statusDot.className = "status-dot";
                return true;
            } catch (error) {
                if (hasRenderedCache || state.allModules.length > staticItems.length) {
                    state.statusKey = "statusErrorCache";
                    statusText.textContent = langObj.statusErrorCache;
                    statusDot.className = "status-dot error";
                } else {
                    setSearchState(true);
                    state.statusKey = "statusErrorStatic";
                    statusText.textContent = langObj.statusErrorStatic;
                    statusDot.className = "status-dot error";
                }
                return false;
            } finally {
                state.isDataLoading = false;
                checkScrollLock();
            }
        }

        updateLanguageUI();
        updateCardWidth();
        updateControlBarLayout();
        updateTabIndicator(false);
        updateSearchLayer();
        cleanOldCaches();
        loadModules();
    </script>
</body>
</html>
